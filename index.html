<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>咕噜远征团</title>
<style>
:root{
  --ink:#2b1c10; --ink2:#5b4630; --paper:#f6e7c3; --paper2:#efdcae; --card:#fff6dd;
  --wood:#65452e; --brass:#d7a34a;
  --green:#73a55c; --green2:#4d7d3a; --blue:#4e9ccb; --blue2:#2f6f9e;
  --purple:#8b75c9; --red:#d8665a; --red2:#b0432f; --gold:#f2b63c;
  --sr:#b678e8; --ssr:#ff9d2e; --r:#5aa7d6;
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#10181f radial-gradient(1200px 700px at 50% -10%, #2c4256 0%, #16222c 55%, #0d141a 100%);
  color:var(--ink); min-height:100vh;
}
#stage{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
  background:#1c2a33;box-shadow:0 0 60px rgba(0,0,0,.6);}
@media(min-width:520px){#stage{border-left:3px solid #0a0f13;border-right:3px solid #0a0f13;}}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#3a2413,#54371d 60%,#65452e);
  border-bottom:3px solid var(--brass);padding:calc(6px + env(safe-area-inset-top)) 8px 7px;
  display:flex;align-items:center;gap:6px;color:#ffeec4;}
#topbar .ttl{font-weight:900;font-size:15px;letter-spacing:1px;color:#ffd977;text-shadow:0 2px 0 #4a2a08;white-space:nowrap;}
.res{display:flex;gap:5px;flex:1;justify-content:flex-end;flex-wrap:wrap;}
.res span{background:rgba(0,0,0,.38);border:1.5px solid rgba(215,163,74,.75);border-radius:999px;
  padding:2px 8px 2px 5px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
.res i{font-style:normal;font-size:13px;}
.iconbtn{background:linear-gradient(180deg,#8a5a30,#65452e);border:2px solid var(--brass);color:#ffe9b0;
  border-radius:10px;min-width:40px;height:36px;font-size:16px;cursor:pointer;position:relative;flex:none;}
.iconbtn:active{transform:translateY(1px);}
.dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border:2px solid #fff;
  border-radius:999px;font-size:10px;font-weight:900;min-width:18px;height:18px;line-height:15px;text-align:center;padding:0 3px;}
/* ---------- layout ---------- */
#view{flex:1;overflow-y:auto;padding-bottom:86px;position:relative;}
.page{padding:12px 12px 20px;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.ptitle{margin:2px 0 10px;color:#ffe9b0;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.45);display:flex;align-items:center;gap:8px;}
/* ---------- panels & buttons ---------- */
.panel{background:linear-gradient(180deg,var(--card),var(--paper));border:3px solid var(--brass);
  border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 0 0 2px #fff8e6;padding:12px;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:2.5px solid #7c4b12;
  background:linear-gradient(180deg,#ffc95e,#f09c1d);color:#4a2703;font-weight:900;font-size:14px;
  padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #8a5a10, inset 0 1px 0 #ffe9a8;min-height:44px;text-decoration:none;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a10;}
.btn.green{background:linear-gradient(180deg,#9ed07a,#5f9c3e);border-color:#3c6423;color:#17330a;box-shadow:0 3px 0 #3c6423, inset 0 1px 0 #dff2c4;}
.btn.blue{background:linear-gradient(180deg,#7cc2ec,#3d86c2);border-color:#20567f;color:#08283f;box-shadow:0 3px 0 #20567f, inset 0 1px 0 #d4efff;}
.btn.red{background:linear-gradient(180deg,#f0937f,#d35a45);border-color:#8f3120;color:#3d0f06;box-shadow:0 3px 0 #8f3120, inset 0 1px 0 #ffd2c6;}
.btn.ghost{background:linear-gradient(180deg,#a97c4c,#7d5730);border-color:#54371a;color:#ffeec4;box-shadow:0 3px 0 #40280f;}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:38px;border-radius:10px;}
.btn:disabled{filter:grayscale(.75) brightness(.85);cursor:not-allowed;transform:none;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}
.cost{font-size:12px;font-weight:800;color:var(--ink2);}
.mut{color:var(--ink2);font-size:12.5px;line-height:1.55;}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;color:#fff;background:#8a6a45;}
.tag.f-森芽{background:var(--green2);} .tag.f-熔炉{background:#c2571f;} .tag.f-潮汐{background:var(--blue2);} .tag.f-星灯{background:#6a4fb0;}
.tag.role{background:#7d5a2e;} .tag.sr{background:var(--sr);} .tag.ssr{background:var(--ssr);} .tag.r{background:var(--r);}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;text-shadow:0 1px 0 #8a5a10;}
.stars .off{color:#c9b98f;text-shadow:none;}
/* ---------- bottom nav ---------- */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:60;
  background:linear-gradient(180deg,#54371d,#3a2413);border-top:3px solid var(--brass);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
#nav button{flex:1;background:none;border:none;color:#d9c391;font-size:11.5px;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;border-radius:10px;position:relative;min-height:52px;}
#nav button .ni{font-size:21px;line-height:1;}
#nav button.on{background:rgba(215,163,74,.22);color:#ffd977;}
/* ---------- city ---------- */
.citywrap{position:relative;margin:-12px -12px 10px;}
.citywrap img{width:100%;display:block;aspect-ratio:1152/1536;object-fit:cover;object-position:50% 62%;}
.cityfade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,transparent,#1c2a33);}
.hotspot{position:absolute;transform:translate(-50%,-50%);background:rgba(30,18,6,.72);border:2px solid var(--brass);
  color:#ffe9b0;border-radius:999px;padding:7px 12px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5);min-height:40px;}
.hotspot:active{transform:translate(-50%,-48%);}
.hotspot .dot{top:-7px;right:-7px;}
.guildname{position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:21px;
  letter-spacing:3px;text-shadow:0 2px 0 #5a3a08,0 0 18px rgba(255,190,60,.65);}
.guildsub{text-align:center;color:#ffe9b0;font-size:12px;text-shadow:0 1px 3px #000;margin-top:2px;position:relative;}
.objcard{border-color:#ffb62e;box-shadow:0 0 0 2px rgba(255,182,46,.45),0 4px 14px rgba(0,0,0,.35);}
.objcard .objtext{font-size:14.5px;font-weight:700;color:#5a3a08;margin:4px 0 9px;}
.idlecard{display:flex;gap:10px;align-items:center;}
.idlecard .big{font-size:19px;font-weight:900;color:#7a4b06;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.tier{border:2px solid #a5814e;border-radius:12px;padding:10px 6px;background:rgba(255,255,255,.35);text-align:center;}
.tier .price{font-size:19px;font-weight:900;color:#6b3d05;margin:3px 0 6px;}
.firsttag{display:inline-block;background:#d8665a;color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;}
.soldout{opacity:.5;}
.entry{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;cursor:pointer;text-align:center;position:relative;}
.entry .ei{font-size:27px;} .entry b{font-size:14px;} .entry span{font-size:11px;color:var(--ink2);}
/* ---------- heroes ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.filters button{border:2px solid #a5814e;background:#efe0b8;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12.5px;cursor:pointer;min-height:36px;color:var(--ink);}
.filters button.on{background:linear-gradient(180deg,#ffc95e,#f09c1d);border-color:#7c4b12;}
.herogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.herocard{background:linear-gradient(180deg,var(--card),var(--paper2));border:3px solid #a5814e;border-radius:12px;
  padding:7px 5px 8px;text-align:center;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25);}
.herocard.q-SR{border-color:var(--sr);} .herocard.q-SSR{border-color:var(--ssr);box-shadow:0 0 12px rgba(255,157,46,.5);}
.herocard .art{height:86px;display:flex;align-items:flex-end;justify-content:center;}
.herocard .art svg{height:86px;width:auto;}
.herocard .art img{height:86px;width:86px;object-fit:cover;border-radius:10px;border:2px solid rgba(122,84,32,.5);}
.detail-head .bigart img{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.slot .box img{width:100%;height:100%;object-fit:contain;}
.pick img{width:56px;height:56px;object-fit:cover;border-radius:9px;display:block;margin:0 auto;}
.mini58 img{width:52px;height:52px;object-fit:cover;border-radius:9px;}
.mini62 img{width:62px;height:62px;object-fit:cover;border-radius:9px;}
.mini44 img{width:44px;height:44px;object-fit:cover;border-radius:8px;}
.unit .uimg img{height:78px;width:78px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,238,196,.9);box-shadow:0 3px 6px rgba(0,0,0,.45);}
.ultbtn .uart img{height:44px;width:44px;object-fit:cover;border-radius:7px;}
.sumcard img{width:84px;height:84px;object-fit:cover;border-radius:10px;}
.dlgline .dav img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;}
.slot.dragover .box{border-color:#ffd23c;box-shadow:0 0 10px rgba(255,210,60,.8);}
.unit.bossu .uimg img{height:108px;width:108px;object-fit:contain;border:none;box-shadow:none;background:transparent;}
.unit .uimg img{object-fit:contain!important;border:none!important;box-shadow:none!important;background:transparent!important;border-radius:0!important;}
.slot,.pick{touch-action:none;}
#dragghost{position:fixed;z-index:600;width:62px;height:62px;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));}
#dragghost img{width:62px;height:62px;object-fit:cover;border-radius:10px;border:2.5px solid var(--gold);}
#topbar{flex-wrap:nowrap;}
#topbar .ttl{font-size:13.5px;letter-spacing:.5px;flex:none;}
#topbar .res{flex-wrap:nowrap;overflow:hidden;}
#topbar .res span{padding:2px 6px 2px 4px;font-size:11.5px;}
#topbar .iconbtn{min-width:36px;height:34px;font-size:14px;}
@media(max-width:430px){#topbar .ttl{display:none;}}
#topbar .iconbtn{flex:0 0 auto;white-space:nowrap;}
#nav button .ni svg{width:21px;height:21px;}
.res span svg{width:13px;height:13px;}
.herocard b{font-size:14px;display:block;}
.herocard .lv{font-size:11.5px;color:var(--ink2);font-weight:700;}
.onteam{position:absolute;top:5px;left:5px;background:var(--green2);color:#fff;font-size:10.5px;font-weight:900;border-radius:6px;padding:2px 6px;z-index:2;}
.newtag{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;font-size:10.5px;font-weight:900;border-radius:6px;padding:2px 6px;z-index:2;}
.detail-head{display:flex;gap:12px;}
.detail-head .bigart{width:128px;height:150px;flex:none;background:radial-gradient(circle at 50% 75%,#ffe9ad 0%,#f1deb5 55%,#e2c68d 100%);
  border:3px solid var(--brass);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.detail-head .bigart svg{height:146px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.statgrid div{background:rgba(101,69,46,.1);border:1.5px solid rgba(101,69,46,.35);border-radius:9px;padding:5px 4px;text-align:center;}
.statgrid b{display:block;font-size:15px;} .statgrid span{font-size:11px;color:var(--ink2);font-weight:700;}
.skillrow{display:flex;gap:9px;padding:8px 0;border-top:1.5px dashed rgba(101,69,46,.4);}
.skillicon{width:46px;height:46px;flex:none;border-radius:11px;border:2.5px solid var(--brass);display:flex;align-items:center;justify-content:center;font-size:23px;background:radial-gradient(circle at 50% 35%,#4d6374,#223039);}
.skillrow b{font-size:13.5px;} .skillrow p{margin:2px 0 0;font-size:12px;color:var(--ink2);line-height:1.5;}
.eqslots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.eqslot{border:2.5px dashed #a5814e;border-radius:11px;min-height:74px;padding:5px 3px;text-align:center;cursor:pointer;background:rgba(255,255,255,.35);font-size:11px;}
.eqslot.filled{border-style:solid;background:var(--card);}
.eqslot .ei2{font-size:24px;line-height:1.15;}
.q-普通{border-color:#9a9a92!important;} .q-优秀{border-color:#5da24a!important;} .q-稀有{border-color:#3f8fd2!important;} .q-史诗{border-color:#a55eea!important;}
.qname-普通{color:#6d6d64;} .qname-优秀{color:#3f7d2c;} .qname-稀有{color:#2470ad;} .qname-史诗{color:#8b3fd9;}
/* ---------- formation ---------- */
.formstage{background:linear-gradient(180deg,#31424f,#223039);border:3px solid var(--brass);border-radius:14px;padding:12px 10px;color:#f3e9cf;margin-bottom:12px;}
.formrow{display:flex;justify-content:center;gap:10px;margin:6px 0;}
.slot{width:76px;text-align:center;cursor:pointer;}
.slot .box{width:76px;height:92px;border:3px dashed rgba(241,222,181,.55);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:rgba(0,0,0,.25);}
.slot.filled .box{border-style:solid;border-color:var(--brass);background:radial-gradient(circle at 50% 80%,#ffe9ad,#e8cf96);}
.slot.sel .box{outline:3px solid var(--gold);outline-offset:2px;}
.slot .box svg{height:88px;}
.slot small{display:block;margin-top:3px;font-size:11px;color:#e8d9ae;font-weight:700;}
.picklist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pick{border:2.5px solid #a5814e;background:var(--card);border-radius:11px;padding:5px 2px 6px;text-align:center;cursor:pointer;font-size:12px;font-weight:800;color:var(--ink);}
.pick svg{height:56px;}
.pick.used{opacity:.45;}
.pick.sel{outline:3px solid var(--gold);}
/* ---------- map ---------- */
.chtabs{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.chtabs button{flex:1;min-width:96px;border:2.5px solid #7c4b12;border-radius:11px;padding:9px 4px;font-weight:900;cursor:pointer;
  background:linear-gradient(180deg,#a97c4c,#7d5730);color:#ffeec4;font-size:13.5px;min-height:44px;}
.chtabs button.on{background:linear-gradient(180deg,#ffc95e,#f09c1d);color:#4a2703;}
.doctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
.doctabs button{flex:1 1 29%;border:2.5px solid #7c4b12;border-radius:11px;padding:9px 2px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#a97c4c,#7d5730);color:#ffeec4;font-size:13px;min-height:44px;}
.doctabs button.on{background:linear-gradient(180deg,#ffc95e,#f09c1d);color:#4a2703;}
.stagerow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;margin-bottom:9px;
  background:linear-gradient(180deg,var(--card),var(--paper));border:3px solid #a5814e;border-radius:13px;padding:9px 11px;box-shadow:0 3px 0 rgba(0,0,0,.25);color:var(--ink);}
.stagerow.cur{border-color:var(--gold);box-shadow:0 0 12px rgba(242,182,60,.55);}
.stagerow.lock{opacity:.55;cursor:not-allowed;}
.stagerow .no{width:46px;height:46px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe1a0,#d7a34a 70%,#a8742a);
  border:2.5px solid #7c4b12;display:flex;align-items:center;justify-content:center;font-weight:900;color:#4a2703;font-size:14px;}
.stagerow.boss .no{background:radial-gradient(circle at 35% 30%,#ffb3a3,#d8503a 70%,#93301f);color:#fff;border-color:#6e1f10;}
.stagerow .inf{flex:1;min-width:0;} .stagerow b{font-size:14.5px;} .stagerow .sub{font-size:11.5px;color:var(--ink2);font-weight:700;}
/* ---------- battle ---------- */
#battlewrap{position:fixed;inset:0;z-index:200;background:#0c141a;display:none;flex-direction:column;}
#battlewrap.open{display:flex;}
.btop{max-width:460px;width:100%;margin:0 auto;display:flex;align-items:center;gap:7px;padding:calc(6px + env(safe-area-inset-top)) 9px 6px;color:#ffeec4;}
.btop .timer{font-weight:900;font-size:16px;background:rgba(0,0,0,.45);border:2px solid var(--brass);border-radius:9px;padding:4px 10px;}
.btop button{background:rgba(0,0,0,.45);border:2px solid var(--brass);color:#ffeec4;border-radius:9px;font-weight:900;padding:7px 10px;cursor:pointer;min-height:40px;font-size:13px;}
.btop button.on{background:var(--brass);color:#3a2405;}
.bfield{flex:1;position:relative;max-width:460px;width:100%;margin:0 auto;background-size:cover;background-position:center;overflow:hidden;}
.bfield.night{background:linear-gradient(180deg,#241b4d 0%,#3a2a6e 34%,#584a8a 55%,#2c2145 56%,#1d1730 100%);}
.unit{position:absolute;width:86px;margin-left:-43px;text-align:center;transition:left .18s ease, top .18s ease;cursor:pointer;z-index:3;}
.unit .uimg{height:78px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));}
.unit .uimg svg{height:78px;}
.unit.bossu{width:120px;margin-left:-60px;} .unit.bossu .uimg{height:108px;} .unit.bossu .uimg svg{height:108px;}
.unit.dead{opacity:.35;filter:grayscale(1);}
.unit.dead .uimg{transform:rotate(80deg);}
.hpbar{height:9px;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.75);border-radius:99px;overflow:hidden;position:relative;}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8ed06a,#5da23e);transition:width .15s;}
.hpbar.sh i{background:linear-gradient(90deg,#ffe9a0,#f2b63c);}
.enbar{height:5px;background:rgba(0,0,0,.6);border-radius:99px;overflow:hidden;margin-top:2px;}
.enbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ffb52e);transition:width .15s;}
.uname{font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);margin-top:1px;white-space:nowrap;}
.ustat{font-size:10px;color:#ffe9a0;text-shadow:0 1px 2px #000;font-weight:800;min-height:13px;}
.focusring{position:absolute;left:-4px;right:-4px;top:14px;height:82px;border:3px solid var(--red);border-radius:14px;pointer-events:none;animation:pulse .7s infinite alternate;}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.castbar{height:7px;background:rgba(0,0,0,.65);border:1.5px solid #ffb3a3;border-radius:99px;overflow:hidden;margin-bottom:2px;}
.castbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9d7a,#d8503a);}
.castbar.brk{border-color:#ffd23c;height:6px;}
.castbar.brk i{background:linear-gradient(90deg,#ffe066,#ff9d2e);}
.castlbl{font-size:9.5px;font-weight:900;color:#ffd23c;text-shadow:0 1px 2px #000;white-space:nowrap;margin-bottom:2px;}
.floater{position:absolute;font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.7);pointer-events:none;z-index:9;animation:floatup .85s ease-out forwards;white-space:nowrap;}
.floater.crit{color:#ffd23c;font-size:21px;} .floater.heal{color:#8bf07a;} .floater.shield{color:#a8d8ff;} .floater.dot{color:#ff9d5c;font-size:13px;}
@keyframes floatup{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.08)}100%{opacity:0;transform:translateY(-44px) scale(1)}}
.lungeR{animation:lungeR .28s ease;} .lungeL{animation:lungeL .28s ease;}
@keyframes lungeR{40%{transform:translateX(16px) scale(1.06)}} @keyframes lungeL{40%{transform:translateX(-16px) scale(1.06)}}
.hitflash{animation:hitf .22s ease;} @keyframes hitf{30%{filter:brightness(2.4) drop-shadow(0 0 6px #fff);transform:translateX(-4px)}}
.castglow{animation:cg .5s ease;} @keyframes cg{40%{filter:brightness(1.7) drop-shadow(0 0 14px gold);transform:scale(1.1)}}

function migrate(st){if(!st||st.schemaVersion!==SCHEMA)return null;const d=defaultState();const merged=Object.assign(d,st);merged.res=Object.assign(d.res,st.res||{});merged.settings=Object.assign(d.settings,st.settings||{});merged.daily=Object.assign(d.daily,st.daily||{});merged.shop=Object.assign(d.shop,st.shop||{});merged.shop.cards=Object.assign(d.shop.cards,(st.shop||{}).cards||{});merged.shop.fund=Object.assign(d.shop.fund,(st.shop||{}).fund||{});merged.shop.pass=Object.assign(d.shop.pass,(st.shop||{}).pass||{});merged.skins=Object.assign(d.skins,st.skins||{});merged.skins.owned=Object.assign({},(st.skins||{}).owned||{});merged.skins.worn=Object.assign({},(st.skins||{}).worn||{});merged.season=Object.assign(d.season,st.season||{});merged.season.cleared=Object.assign({},(st.season||{}).cleared||{});merged.season.shopBought=Object.assign({},(st.season||{}).shopBought||{});merged.arena=Object.assign(d.arena,st.arena||{});merged.arena.hist=Array.isArray((st.arena||{}).hist)?(st.arena||{}).hist.slice(0,20):[];return merged;}
function validateSave(st){
 if(!st||typeof st!=='object')return '存档格式不正确';
 if(st.schemaVersion!==SCHEMA)return '存档版本不兼容';
 for(const k of['gold','exp','dia','ticket','book','stone'])if(!(st.res&&st.res[k]>=0))return '资源数据异常';
 for(const id in st.heroes||{})if(!HEROES[id])return '存档含未知英雄';
 if(st.res&&(st.res.stardust<0||st.res.skinTicket<0))return '资源数据异常';
 for(const id in ((st.skins||{}).owned||{}))if(!SKINS[id])return '存档含未知外观';
 for(const id in ((st.skins||{}).worn||{}))if(!SKINS[id])return '存档含未知外观';
 if(st.arena&&(!(st.arena.score>=0)||!(st.arena.left>=0&&st.arena.left<=5)))return '竞技场数据异常';
 const uids=new Set();for(const e of st.equips||[]){if(uids.has(e.uid))return '装备实例重复';uids.add(e.uid);}

function heroStats(id){
 const h=S.heroes[id];if(!h)return null;const H=HEROES[id],lv=h.lv,sm=STAR_MULT[h.star];
 let hp=Math.floor(H.base[0]*(1+0.065*(lv-1))*sm), atk=Math.floor(H.base[1]*(1+0.055*(lv-1))*sm);
 let armor=Math.floor(H.base[2]*(1+0.045*(lv-1))*sm), mres=Math.floor(H.base[3]*(1+0.045*(lv-1))*sm);
 let spd=H.base[4], crit=5, healPct=0, resist=0, atkPctE=0;
 S.equips.filter(e=>e.hero===id).forEach(e=>{const m=1+e.lv*0.08;for(const k in e.stats){const v=e.stats[k]*m;
  if(k==='hp')hp+=Math.floor(v);else if(k==='atk')atk+=Math.floor(v);else if(k==='armor')armor+=Math.floor(v);else if(k==='mres')mres+=Math.floor(v);
  else if(k==='spd')spd+=Math.floor(v);else if(k==='crit')crit+=v;else if(k==='healPct')healPct+=v;else if(k==='resist')resist+=v;else if(k==='atkPct')atkPctE+=v;}});
 atk=Math.floor(atk*(1+atkPctE/100));
 return {hp:hp,atk:atk,armor:armor,mres:mres,spd:spd,crit:crit,healPct:healPct,resist:resist,int:H.base[5]};
}
function powerOf(id){const s=heroStats(id);if(!s)return 0;const h=S.heroes[id];return Math.round(s.hp/10+s.atk*4+s.armor*2+s.mres*2+s.spd+(h.star-1)*60+(h.sk.active+h.sk.ult+h.sk.passive-3)*25);}
function teamPower(){return S.formation.filter(Boolean).reduce((a,id)=>a+powerOf(id),0);}

function calcBonds(form){

 FACTIONS.forEach(f=>{cnt[f]=ids.filter(id=>HEROES[id].fac===f).length;if(!cnt[f])allFour=false;});

function questProgress(q){
 const c=S.counters,d=S.daily.counters;
 switch(q.count){
  case 'stage11':return S.stages['1-1']?1:0;
  case 'ch1':return S.stages['1-10']?1:0;
  case 'maxStage':return Object.keys(S.stages).length;
  case 'tower':return S.tower;
  case 'star3':return HERO_IDS.some(id=>S.heroes[id]&&S.heroes[id].star>=3)?1:0;
  case 'chStars1':case 'chStars2':case 'chStars3':case 'chStars4':{const ch=+q.count.slice(-1);let t=0;for(let i=1;i<=10;i++)t+=S.stages[ch+'-'+i]||0;return t;}
  default:return q.daily?(d[q.count]||0):(c[q.count]||0);
 }
}

 const now=Date.now();let mins=S.idle.pendMin+(now-S.idle.lastCalc)/60000;

}

function shopLog(txt,amt){const sh=S.shop;sh.ledger.push({ts:Date.now(),txt:txt,amt:amt||0});if(sh.ledger.length>40)sh.ledger=sh.ledger.slice(-40);}
function passLevel(){return Math.min(PASS_MAXLV,Math.floor(S.shop.pass.xp/PASS_XP_PER));}
function passAddXp(n){if(!S||!S.shop)return;const before=passLevel();S.shop.pass.xp+=n;if(passLevel()>before)setTimeout(()=>toast('远征战令提升到 '+passLevel()+' 级，新奖励可领取'),700);}
function shopClaimable(){const sh=S.shop;if(!sh)return false;const day=gameDay();
 if(sh.walletDay!==day)return true;
 if(SHOP_CUM.some((c,i)=>sh.totalCharged>=c.need&&!sh.cumClaimed[i]))return true;
 for(const k in SHOP_CARDS){const c=sh.cards[k];if(c.until>Date.now()&&c.lastClaim!==day)return true;}
 if(sh.fund.bought&&FUND_TIERS.some((t,i)=>highestStageIdx()>=t.need&&!sh.fund.claimed[i]))return true;
 const lv=passLevel(),p=sh.pass;
 for(let i=1;i<=lv;i++){if(!p.claimedFree[i])return true;if(p.premium&&!p.claimedPrem[i])return true;}
 return false;}
function shopClaimWallet(){const sh=S.shop,day=gameDay();if(sh.walletDay===day){toast('今日已补领过，明天再来');return;}sh.wallet+=500;sh.walletDay=day;shopLog('每日免费补领模拟额度',500);sfx.coin();save();render();toast('已补领 500 模拟币，当前余额 '+sh.wallet);}
function shopBuyTier(id){if(shopBusy)return;const t=SHOP_TIERS.find(x=>x.id===id),sh=S.shop;if(!t)return;
 if(sh.wallet<t.price){toast('模拟钱包额度不足（需要 '+t.price+'），每日可免费补领 500');return;}
 shopBusy=true;sh.wallet-=t.price;sh.totalCharged+=t.price;
 const first=!sh.firstBought[t.id],gain=t.dia*(first?2:1);sh.firstBought[t.id]=true;S.res.dia+=gain;
 shopLog('购买钻石档 '+t.price+' 模拟币'+(first?'（首充双倍）':''),-t.price);
 sfx.coin();save();renderTop();render();toast('模拟充值成功：钻石 +'+gain+(first?'（首充双倍）':''));setTimeout(()=>{shopBusy=false;},400);}
function shopClaimCum(i){const sh=S.shop,c=SHOP_CUM[i];if(!c||sh.cumClaimed[i]||sh.totalCharged<c.need)return;sh.cumClaimed[i]=true;addRes(c.rew);sfx.coin();save();renderTop();render();toast('累充返利：'+rewText(c.rew));}
function cardDaysLeft(k){return Math.max(0,Math.ceil((S.shop.cards[k].until-Date.now())/86400000));}
function shopBuyCard(k){if(shopBusy)return;const def=SHOP_CARDS[k],sh=S.shop,c=sh.cards[k];
 if(sh.wallet<def.price){toast('模拟钱包额度不足（需要 '+def.price+'）');return;}
 shopBusy=true;sh.wallet-=def.price;sh.totalCharged+=def.price;c.until=Math.max(Date.now(),c.until)+def.days*86400000;
 shopLog((c.until>Date.now()&&cardDaysLeft(k)>def.days?'续购':'购买')+def.name+'（'+def.days+' 天）',-def.price);
 sfx.coin();save();render();toast(def.name+'已生效（剩余 '+cardDaysLeft(k)+' 天）：每天可领钻石 ×'+def.daily);setTimeout(()=>{shopBusy=false;},400);}
function shopClaimCard(k){const def=SHOP_CARDS[k],sh=S.shop,c=sh.cards[k],day=gameDay();
 if(c.until<=Date.now()){toast(def.name+'未生效或已过期');return;}
 if(c.lastClaim===day){toast('今日'+def.name+'奖励已领取');return;}
 c.lastClaim=day;S.res.dia+=def.daily;shopLog(def.name+'每日奖励领取',0);
 sfx.coin();save();renderTop();render();toast(def.name+'每日奖励：钻石 +'+def.daily);}
function shopBuyFund(){if(shopBusy)return;const sh=S.shop;if(sh.fund.bought)return;
 if(sh.wallet<FUND_PRICE){toast('模拟钱包额度不足（需要 '+FUND_PRICE+'）');return;}
 shopBusy=true;sh.wallet-=FUND_PRICE;sh.totalCharged+=FUND_PRICE;sh.fund.bought=true;shopLog('购买成长基金',-FUND_PRICE);
 sfx.coin();save();render();toast('成长基金已开通，按主线进度逐档领取');setTimeout(()=>{shopBusy=false;},400);}
function shopClaimFund(i){const sh=S.shop,t=FUND_TIERS[i];if(!t||!sh.fund.bought||sh.fund.claimed[i]||highestStageIdx()<t.need)return;sh.fund.claimed[i]=true;addRes(t.rew);sfx.coin();save();renderTop();render();toast('成长基金：'+rewText(t.rew));}
function shopBuyPass(){if(shopBusy)return;const sh=S.shop;if(sh.pass.premium)return;
 if(sh.wallet<PASS_PRICE){toast('模拟钱包额度不足（需要 '+PASS_PRICE+'）');return;}
 shopBusy=true;sh.wallet-=PASS_PRICE;sh.totalCharged+=PASS_PRICE;sh.pass.premium=true;shopLog('购买远征战令 · 高级轨',-PASS_PRICE);
 sfx.coin();save();render();toast('高级轨已开通，已达等级的奖励可补领');setTimeout(()=>{shopBusy=false;},400);}
function shopClaimPass(lv,prem){const sh=S.shop,p=sh.pass;if(lv>passLevel())return;
 if(prem){if(!p.premium||p.claimedPrem[lv])return;p.claimedPrem[lv]=true;}
 else{if(p.claimedFree[lv])return;p.claimedFree[lv]=true;}
 const rew=passRew(lv,prem);addRes(rew);sfx.coin();save();renderTop();render();toast('战令 '+lv+' 级奖励：'+rewText(rew));}
function shopBuyPack(id){if(shopBusy)return;const pk=SHOP_PACKS.find(x=>x.id===id),sh=S.shop;if(!pk)return;const n=sh.packBought[id]||0;
 if(n>=pk.limit){toast('该礼包已售罄');return;}
 if(sh.wallet<pk.price){toast('模拟钱包额度不足（需要 '+pk.price+'）');return;}
 shopBusy=true;sh.wallet-=pk.price;sh.totalCharged+=pk.price;sh.packBought[id]=n+1;addRes(pk.rew);shopLog('购买礼包「'+pk.name+'」',-pk.price);
 sfx.coin();save();renderTop();render();toast('礼包到账：'+rewText(pk.rew));setTimeout(()=>{shopBusy=false;},400);}
function vShop(){
 const sh=S.shop,day=gameDay(),cleared=highestStageIdx(),plv=passLevel();
 const tiers=SHOP_TIERS.map(t=>{const first=!sh.firstBought[t.id];return '<div class="tier"><div style="font-size:24px">'+ICONS.dia+'</div><b>钻石 ×'+t.dia+'</b><br>'+(first?'<span class="firsttag">首充双倍 · 实得 '+t.dia*2+'</span>':'<span class="mut" style="font-size:11px">首充双倍已领</span>')+'<div class="price">'+t.price+' <span style="font-size:12px">模拟币</span></div><button class="btn sm '+(sh.wallet>=t.price?'green':'')+'" '+(sh.wallet<t.price?'disabled':'')+' onclick="shopBuyTier(\''+t.id+'\')">'+(sh.wallet>=t.price?'模拟购买':'额度不足')+'</button></div>';}).join('');
 const cards=Object.keys(SHOP_CARDS).map(k=>{const def=SHOP_CARDS[k],c=sh.cards[k],active=c.until>Date.now(),left=cardDaysLeft(k),claimedToday=c.lastClaim===day;

   :'<div class="mut" style="font-size:12px">未开通</div><div style="margin-top:5px"><button class="btn sm '+(sh.wallet>=def.price?'green':'')+'" '+(sh.wallet<def.price?'disabled':'')+' onclick="shopBuyCard(\''+k+'\')">'+(sh.wallet>=def.price?'模拟购买':'额度不足')+'</button></div>')+'</div>';}).join('');
 const cum=SHOP_CUM.map((c,i)=>{const got=!!sh.cumClaimed[i],reach=sh.totalCharged>=c.need;
  return '<div class="itemrow"><div style="flex:1"><b>累计 '+c.need+' 模拟币</b><div class="mut">返利 '+rewText(c.rew)+' · 当前累计 '+Math.min(sh.totalCharged,c.need)+'/'+c.need+'</div><div class="progress" style="margin-top:4px"><i style="width:'+Math.min(100,sh.totalCharged/c.need*100)+'%"></i></div></div>'

 const fundRows=FUND_TIERS.map((t,i)=>{const got=!!sh.fund.claimed[i],reach=cleared>=t.need;
  return '<div class="itemrow"><div style="flex:1"><b>通关主线 '+t.need+' 关</b><div class="mut">奖励 '+rewText(t.rew)+' · 当前进度 '+Math.min(cleared,t.need)+'/'+t.need+'</div></div>'
  +(got?'<span class="cost">已领取</span>':!sh.fund.bought?'<span class="mut">未开通</span>':reach?'<button class="btn sm green" onclick="shopClaimFund('+i+')">领取</button>':'<span class="mut">未达成</span>')+'</div>';}).join('');
 let passRows='';
 for(let lv=1;lv<=PASS_MAXLV;lv++){const reached=lv<=plv,fGot=!!sh.pass.claimedFree[lv],pGot=!!sh.pass.claimedPrem[lv];
  passRows+='<div class="itemrow"><div style="flex:1"><b>'+lv+' 级</b><div class="mut">免费 '+rewText(passRew(lv,false))+'<br>高级 '+rewText(passRew(lv,true))+'</div></div>'
  +(fGot?'<span class="cost">免费已领</span>':reached?'<button class="btn sm green" onclick="shopClaimPass('+lv+',false)">领免费</button>':'<span class="mut">未达成</span>')
  +(sh.pass.premium?(pGot?'<span class="cost">高级已领</span>':reached?'<button class="btn sm" onclick="shopClaimPass('+lv+',true)">领高级</button>':'<span class="mut">未达成</span>'):'<span class="mut">高级未开通</span>')+'</div>';}
 const packs=SHOP_PACKS.map(pk=>{const n=sh.packBought[pk.id]||0,out=n>=pk.limit;
  return '<div class="tier'+(out?' soldout':'')+'"><b style="font-size:15px">'+pk.name+'</b><div class="mut" style="font-size:12px">'+rewText(pk.rew)+'</div><div class="price">'+pk.price+' <span style="font-size:12px">模拟币</span></div><div class="mut" style="font-size:12px">限购 '+n+'/'+pk.limit+'</div><div style="margin-top:5px">'+(out?'<button class="btn sm" disabled>已售罄</button>':'<button class="btn sm '+(sh.wallet>=pk.price?'green':'')+'" '+(sh.wallet<pk.price?'disabled':'')+' onclick="shopBuyPack(\''+pk.id+'\')">'+(sh.wallet>=pk.price?'模拟购买':'额度不足')+'</button>')+'</div></div>';}).join('');
 const ledger=sh.ledger.slice(-8).reverse().map(l=>'<div class="kv"><span>'+new Date(l.ts+8*3600*1000).toISOString().slice(5,10)+' '+l.txt+'</span><b>'+(l.amt>0?'+'+l.amt:l.amt<0?''+l.amt:'—')+(l.amt!==0?' 模拟币':'')+'</b></div>').join('');
 return '<div class="page"><button class="backbtn" onclick="go(\'city\')">← 主城</button>'
 +'<h2 class="ptitle" style="margin-top:8px">'+ICONS.dia+' 模拟充值中心</h2>'
 +'<div class="panel" style="border-color:var(--gold)"><b>模拟充值 · 不涉及真实付费</b><div class="mut" style="margin-top:4px">这里花费的是免费发放的「模拟钱包额度」，不接真实支付、不扣真实货币。模拟币与钻石比例 1 : 10。</div>'
 +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div><span class="mut">模拟钱包余额</span><div style="font-size:24px;font-weight:900;color:#6b3d05">'+sh.wallet+' 模拟币</div><span class="mut">累计模拟充值 '+sh.totalCharged+' 模拟币</span></div>'
 +(sh.walletDay===day?'<span class="cost">今日补领已领</span>':'<button class="btn green" onclick="shopClaimWallet()">每日补领 +500</button>')+'</div>'
 +'<div class="mut" style="margin-top:4px">初始发放 2000 模拟币；每个游戏日可免费补领一次 500 模拟币。</div></div>'
 +'<div class="panel"><b>钻石充值（逐档首充双倍）</b><div class="shopgrid" style="margin-top:8px">'+tiers+'</div></div>'

 +'<div class="panel"><b>累充返利</b>'+cum+'</div>'
 +'<div class="panel"><b>成长基金</b>'+(sh.fund.bought?'<div class="mut" style="margin:4px 0">已开通 · 按通关主线关数逐档领取，长期有效。</div>':'<div class="itemrow"><div style="flex:1"><b>开通成长基金</b><div class="mut">一次购买 '+FUND_PRICE+' 模拟币，全档奖励合计钻石 ×1010、招募券 ×3、技能书 ×15，按主线进度领取。</div></div><button class="btn sm '+(sh.wallet>=FUND_PRICE?'green':'')+'" '+(sh.wallet<FUND_PRICE?'disabled':'')+' onclick="shopBuyFund()">'+(sh.wallet>=FUND_PRICE?'模拟购买':'额度不足')+'</button></div>')+fundRows+'</div>'
 +'<div class="panel"><b>远征战令（本期）</b><div class="mut" style="margin:4px 0">当前 '+plv+' / '+PASS_MAXLV+' 级 · 经验 '+sh.pass.xp%PASS_XP_PER+' / '+PASS_XP_PER+'（战斗胜 +30 / 负 +15、领任务奖励 +15/个、完成一次迷雾远征 +40）</div><div class="progress"><i style="width:'+(sh.pass.xp%PASS_XP_PER)+'%"></i></div>'
 +(sh.pass.premium?'<div class="mut" style="margin-top:6px">高级轨已开通，已达等级的高级奖励可补领。</div>':'<div class="itemrow"><div style="flex:1"><b>高级轨</b><div class="mut">'+PASS_PRICE+' 模拟币一次开通，购买后可补领全部已达等级的高级奖励。</div></div><button class="btn sm '+(sh.wallet>=PASS_PRICE?'green':'')+'" '+(sh.wallet<PASS_PRICE?'disabled':'')+' onclick="shopBuyPass()">'+(sh.wallet>=PASS_PRICE?'模拟购买':'额度不足')+'</button></div>')
 +passRows+'</div>'
 +'<div class="panel"><b>限时礼包（限购）</b><div class="shopgrid" style="margin-top:8px">'+packs+'</div></div>'
 +'<div class="panel"><b>模拟钱包流水</b>'+(ledger||'<div class="emptybox">暂无流水</div>')+'</div>'
 +'</div>';
}
/* ---------------- 英雄培养 ---------------- */
function upCost(lv){return {gold:40+18*lv,exp:20+10*lv};}
function doUpgrade(id,times){
 const h=S.heroes[id];let done=0,need={gold:0,exp:0};
 while(done<times&&h.lv<60){const c=upCost(h.lv);if(S.res.gold<c.gold||S.res.exp<c.exp)break;S.res.gold-=c.gold;S.res.exp-=c.exp;h.spent.gold+=c.gold;h.spent.exp+=c.exp;h.lv++;done++;}
 if(!done){const c=upCost(h.lv);toast(h.lv>=60?'已满级':'资源不足：还差金币 '+Math.max(0,c.gold-S.res.gold)+' · 经验 '+Math.max(0,c.exp-S.res.exp));return 0;}
 bump('upgrades',done);sfx.coin();save();return done;
}
function doSkillUp(id,which){
 const h=S.heroes[id],cur=h.sk[which];
 if(cur>=10){toast('技能已满级');return;}
 if(cur>=h.lv+4){toast('技能等级不能超过英雄等级+4，先提升英雄等级');return;}
 const gold=50*cur,book=1+Math.floor(cur/2);
 if(S.res.book<book||S.res.gold<gold){toast('资源不足：需要技能书 '+book+' · 金币 '+gold);return;}
 S.res.book-=book;S.res.gold-=gold;h.spent.book+=book;h.spent.gold+=gold;h.sk[which]++;sfx.magic();save();
 toast(HEROES[id].sk[which].n+' 升到 '+h.sk[which]+' 级');
}
function doPromote(id){
 const h=S.heroes[id];if(h.star>=5){toast('已满星');return;}
 const need=STAR_FRAG[h.star],gold=STAR_GOLD[h.star],have=S.frags[id]||0;
 if(have<need){toast('碎片不足：'+HEROES[id].name+'碎片 '+have+'/'+need+'（招募重复英雄可获得）');return;}
 if(S.res.gold<gold){toast('金币不足：需要金币 '+gold);return;}
 S.frags[id]-=need;S.res.gold-=gold;h.star++;sfx.summon();save();toast(HEROES[id].name+' 升到 '+h.star+' 星！');renderTop();render();
}
function doReset(id){
 const h=S.heroes[id],sp=h.spent;
 if(h.lv<=1&&sp.book<=0){toast('该英雄还没有可返还的投入');return;}
 openModal('<h3>重置 '+HEROES[id].name+'？</h3><p class="mut">等级回到 1 级，技能回到 1 级，星级保留。将返还实际投入：金币 '+fmt(sp.gold)+' · 经验 '+fmt(sp.exp)+' · 技能书 '+sp.book+'。装备不受影响。</p><div class="btnrow"><button class="btn red" onclick="confirmReset(\''+id+'\')">确认重置</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function confirmReset(id){const h=S.heroes[id];S.res.gold+=h.spent.gold;S.res.exp+=h.spent.exp;S.res.book+=h.spent.book;h.spent={gold:0,exp:0,book:0};h.lv=1;h.sk={active:1,ult:1,passive:1};sfx.coin();save();closeModal();renderTop();render();toast('已重置，投入全部返还');}
/* ---------------- 装备操作 ---------------- */
function eqStatsText(e){const m=1+e.lv*0.08;const N={hp:'生命',atk:'攻击',armor:'护甲',mres:'魔抗',spd:'速度',crit:'暴击%',healPct:'治疗%',resist:'抵抗%',atkPct:'攻击%'};return Object.keys(e.stats).map(k=>N[k]+'+'+Math.round(e.stats[k]*m*10)/10).join(' · ');}
function eqScore(e,role){
 const m=1+e.lv*0.08,s=e.stats,W={hp:0.1,atk:4,armor:2.2,mres:2.2,spd:1.2,crit:6,healPct:6,resist:5,atkPct:7};
 if(role==='坦克'){W.hp=0.16;W.armor=3.4;W.mres=3;W.atk=1.5;}
 if(role==='治疗'){W.atk=5;W.healPct=10;W.hp=0.12;}
 if(role==='辅助'){W.spd=3;W.resist=8;W.hp=0.12;W.atk=3;}
 let t=0;for(const k in s)t+=s[k]*m*(W[k]||1);return Math.round(t);
}
function equipTo(eid,hid){const e=S.equips.find(x=>x.uid===eid);if(!e)return;
 S.equips.forEach(x=>{if(x.hero===hid&&x.slot===e.slot)x.hero=null;});
 if(e.hero&&e.hero!==hid){/* 从别人身上换下 */} e.hero=hid;bump('equips');sfx.click();save();render();}
function unequip(eid){const e=S.equips.find(x=>x.uid===eid);if(e){e.hero=null;sfx.click();save();render();}}
function doEnhance(eid){const e=S.equips.find(x=>x.uid===eid);if(!e)return;
 if(e.lv>=10){toast('已强化满级');return;}
 const stone=1+e.lv,gold=30*(e.lv+1);
 if(S.res.stone<stone||S.res.gold<gold){toast('资源不足：需要强化石 '+stone+' · 金币 '+gold);return;}
 S.res.stone-=stone;S.res.gold-=gold;e.lv++;sfx.magic();save();renderTop();render();toast(e.name+' 强化 +'+e.lv);}
function doDismantle(eid){const e=S.equips.find(x=>x.uid===eid);if(!e||e.hero||e.locked)return;
 const gain=1+e.lv+(e.qual==='稀有'?1:e.qual==='史诗'?3:0);
 S.equips=S.equips.filter(x=>x.uid!==eid);S.res.stone+=gain;sfx.coin();save();renderTop();render();toast('分解获得强化石×'+gain);}
function autoEquip(id){
 const role=HEROES[id].role;let changed=0;
 ['weapon','armor','trinket','boots'].forEach(slot=>{
  const cand=S.equips.filter(e=>e.slot===slot&&e.hero!==id).sort((a,b)=>eqScore(b,role)-eqScore(a,role))[0];
  const cur=S.equips.find(e=>e.slot===slot&&e.hero===id);
  if(cand&&(!cur||eqScore(cand,role)>eqScore(cur,role))){if(cur)cur.hero=null;cand.hero=id;changed++;}
 });

const POOLS={R:HERO_IDS.filter(id=>HEROES[id].rar==='R'),SR:HERO_IDS.filter(id=>HEROES[id].rar==='SR'),SSR:HERO_IDS.filter(id=>HEROES[id].rar==='SSR')};
const FRAG_BY_RAR={R:5,SR:10,SSR:20};
function rollOne(){
 const P=S.pity;let rar;
 if(P.sinceSSR>=49)rar='SSR';
 else{const r=Math.random();rar=r<0.05?'SSR':(r<0.40?'SR':'R');}
 // 十抽保底：组内第十抽且前九无 SR+
 if(P.group>=9&&!P.groupSR&&rar==='R')rar='SR';
 if(rar==='SSR')P.sinceSSR=0;else P.sinceSSR++;
 if(rar!=='R')P.groupSR=true;
 P.group++;if(P.group>=10){P.group=0;P.groupSR=false;}

function doSummon(n,pay){

 if(pay==='ticket'){if(S.res.ticket<costT){toast('招募券不足（需要 '+costT+' 张）');return;}S.res.ticket-=costT;}
 else{if(S.res.dia<costD){toast('钻石不足（需要 '+costD+'）');return;}S.res.dia-=costD;}

  if(isNew){S.heroes[id]={lv:1,star:1,sk:{active:1,ult:1,passive:1},spent:{gold:0,exp:0,book:0},isNew:true};}
  else{S.frags[id]=(S.frags[id]||0)+FRAG_BY_RAR[HEROES[id].rar];}
  results.push({id:id,isNew:isNew});}

/* ============================================================
   战斗引擎：固定 100ms 逻辑步 + 种子随机，模拟与表现分离

let B=null;
function aliveUnits(side){return B.units.filter(u=>u.side===side&&u.alive);}
function unitByUid(uid){return B.units.find(u=>u.uid===uid);}
function hasBuff(u,type){return u.buffs.some(b=>b.type===type&&B.t<b.until);}
function buffSum(u,type){let s=0;u.buffs.forEach(b=>{if(b.type===type&&B.t<b.until)s+=b.val;});return s;}
function buffMax(u,type){let s=0;u.buffs.forEach(b=>{if(b.type===type&&B.t<b.until)s=Math.max(s,b.val);});return s;}
function addBuff(u,type,val,dur,src,extra){
 if(!u.alive)return;
 if(u.isBoss&&(type==='stun'||type==='silence'))dur=dur*0.35;
 if(u.isBoss&&type==='slow')val=Math.max(val,-0.20);
 const ex=u.buffs.find(b=>b.type===type&&b.src===(src?src.uid:null)&&B.t<b.until);
 if(ex&&(type==='burn'||type==='poison')){ex.stacks=Math.min(3,(ex.stacks||1)+1);ex.until=B.t+dur*1000;ex.tickAtk=src?effAtk(src):ex.tickAtk;return ex;}
 if(ex&&(type==='atkPct'&&src&&src.hid==='yefeng')){ex.stacks=Math.min(3,(ex.stacks||1)+1);ex.val=0.05*ex.stacks;ex.until=B.t+dur*1000;return ex;}
 if(ex){ex.val=Math.max(ex.val,val);ex.until=B.t+dur*1000;return ex;}
 const b=Object.assign({type:type,val:val,until:B.t+dur*1000,src:src?src.uid:null,stacks:1,nextTick:B.t+1000},extra||{});
 u.buffs.push(b);return b;
}
function addShield(u,amt,dur,src,tag){
 if(B&&B.relics&&B.relics.shield&&u.side===0)amt=Math.round(amt*1.15); // 迷雾远征遗物：盾量+15%
 const cap=u.maxHp*0.6;let cur=u.shields.reduce((a,s)=>a+s.amt,0);
 amt=Math.min(amt,Math.max(0,cap-cur));if(amt<=0)return;
 const ex=u.shields.find(s=>s.src===(src?src.uid:null)&&s.tag===tag);
 if(ex){if(amt>ex.amt)ex.amt=amt;ex.until=B.t+dur*1000;}
 else u.shields.push({amt:amt,until:B.t+dur*1000,src:src?src.uid:null,tag:tag||''});
 B.events.push({k:'shield',uid:u.uid,val:Math.round(amt)});
 if(src&&src.side===0)B.log.push(src.name+' 为 '+u.name+' 施加护盾 '+Math.round(amt));
}
function effAtk(u){let a=u.atk*(1+buffSum(u,'atkPct'));if(u.flags.weakUntil&&B&&B.t<u.flags.weakUntil)a*=0.9;return a;}
function effSpd(u){return Math.max(30,u.spd*(1+buffSum(u,'spdPct')+buffSum(u,'slow')));}
function effArmor(u){return u.armor*(1-buffMax(u,'defDown'));}
function effMres(u){return u.mres*(1-buffMax(u,'mresDown'));}
function gainEnergy(u,n){u.energy=clamp(u.energy+n,0,100);}
function hurtEnergy(u){ // 受伤回能：每秒最多 +10
 const w=Math.floor(B.t/1000);
 if(u._enWin!==w){u._enWin=w;u._enGot=0;}
 const can=Math.min(5,10-u._enGot);if(can>0){gainEnergy(u,can);u._enGot+=can;}
}
function applyDamage(src,tgt,dmg,opts){
 opts=opts||{};
 // 护盾吸收（近到期优先）
 let remain=dmg;tgt.shields.sort((a,b)=>a.until-b.until);
 for(const sh of tgt.shields){if(remain<=0)break;const ab=Math.min(sh.amt,remain);sh.amt-=ab;remain-=ab;
  if(sh.amt<=0&&tgt.hid==='xingkui')xingkuiShieldBreak(tgt);
  if(sh.amt<=0&&tgt.isBoss&&tgt.bossKey==='2'&&sh.tag==='boss2'&&(!tgt.flags.weakAt||B.t-tgt.flags.weakAt>2000)){tgt.flags.weakAt=B.t;tgt.flags.weakUntil=B.t+2000;addBuff(tgt,'vuln',0.25,2,tgt);B.log.push('锅炉王的护盾被打破，陷入虚弱（受伤+25%、攻击-10%，2秒）！');B.events.push({k:'cast',uid:tgt.uid});}
  B.events.push({k:'absorb',uid:tgt.uid,val:Math.round(ab)});}
 tgt.shields=tgt.shields.filter(s=>s.amt>0);
 if(remain>0){
  tgt.hp-=remain;tgt.stats.taken+=remain;
  if(src)src.stats.dmg+=remain;
  hurtEnergy(tgt);
  if(tgt.hp<=0){tgt.hp=0;tgt.alive=false;tgt.buffs=[];tgt.shields=[];
   B.events.push({k:'death',uid:tgt.uid});
   B.log.push(tgt.name+' 倒下了');
   if(tgt.side===0&&tgt.pos<2&&B.frontDeathT==null)B.frontDeathT=B.t;
   if(tgt.side===0&&tgt.energy>=100)B.ultIdle=true;
   if(B.focus===tgt.uid)B.focus=null;
   if(src&&src!==tgt&&src.side===0&&src.alive&&B.relics&&B.relics.killHeal)healUnit(src,src,src.maxHp*0.06,{noScale:true}); // 遗物：击杀恢复
   if(src&&opts.direct)killHook(src,tgt);
  } else {
   if(tgt.hid==='taidun'&&!tgt.flags.taidunP&&tgt.hp<tgt.maxHp*0.35){tgt.flags.taidunP=true;healUnit(tgt,tgt,tgt.maxHp*0.10,{noScale:true});B.log.push('苔盾「虽然害怕」触发，恢复生命');}
   checkHelingPassive(tgt);
  }
 }
 return dmg;
}
function dealDamage(src,tgt,mult,type,opts){
 opts=opts||{};if(!tgt||!tgt.alive||!src||!src.alive&&!opts.dot)return {dmg:0,killed:false};
 // 星盔分担（不递归）
 if(!opts.dot&&!opts.shared){const sh=tgt.buffs.find(b=>b.type==='share'&&B.t<b.until);
  if(sh){const shu=unitByUid(sh.src);if(shu&&shu.alive&&shu!==tgt){
   const pre=calcDamage(src,tgt,mult,type,opts);
   const part=Math.floor(pre.dmg*sh.val);
   if(part>0){applyDamage(src,shu,part,{shared:true});B.events.push({k:'dmg',uid:shu.uid,val:part,kind:'norm'});
    const rest=Math.max(1,pre.dmg-part);applyDamage(src,tgt,rest,opts);finalizeHit(src,tgt,rest,pre.crit,opts);
    return {dmg:pre.dmg,killed:!tgt.alive};}}}}
 const c=calcDamage(src,tgt,mult,type,opts);
 applyDamage(src,tgt,c.dmg,opts);
 // 集火破蓄：Boss 蓄力可打断、且正被设为集火目标时，我方直接伤害累计计入破蓄进度（持续伤害/分担伤害不计）
 if(opts.direct&&src&&src.side===0&&tgt.alive&&tgt.cast&&tgt.cast.interruptible!==false&&tgt.cast.breakNeed>0&&B.focus===tgt.uid){
  tgt.cast.breakGot+=c.dmg;
  if(tgt.cast.breakGot>=tgt.cast.breakNeed){const cn=tgt.cast.name;tgt.cast=null;
   B.log.push(tgt.name+' 的「'+cn+'」被集火打断！（集火破蓄达成：蓄力期间累计直接伤害达到其最大生命 '+Math.round(CAST_BREAK.pct*100)+'%）');
   B.events.push({k:'interrupt',uid:tgt.uid,via:'focus'});}
 }
 finalizeHit(src,tgt,c.dmg,c.crit,opts);
 return {dmg:c.dmg,killed:!tgt.alive};
}
function calcDamage(src,tgt,mult,type,opts){
 let atk=effAtk(src)*(opts.atkMul||1);
 const def=type==='phys'?effArmor(tgt):effMres(tgt);
 let crit=false,cm=1;
 if(!opts.dot&&opts.canCrit!==false){let cr=src.crit+(opts.critBonus||0);
  if(tgt.buffs.some(b=>b.type==='mark'&&b.srcName==='yefeng'&&src.hid==='yefeng'))cr+=15;
  if(B.rng()<cr/100){crit=true;cm=1.5;}}
 const facM=COUNTER[src.fac]===tgt.fac?1.15:1;
 const vuln=opts.dot?0:buffMax(tgt,'vuln')+buffMax(tgt,'mark');
 const red=clamp(buffSum(tgt,'dmgRed'),0,0.7);
 const variance=opts.dot?1:0.95+B.rng()*0.10;
 let dmg=atk*mult*100/(100+Math.max(0,def))*cm*facM*(1+vuln)*variance*(1-red);
 return {dmg:Math.max(1,Math.floor(dmg)),crit:crit};
}
function finalizeHit(src,tgt,dmg,crit,opts){
 if(opts.dot)return;
 B.events.push({k:'dmg',uid:tgt.uid,val:dmg,kind:crit?'crit':'norm'});
 if(crit&&src.hid==='yefeng')addBuff(src,'atkPct',0.05,4,src);
 if(opts.basic){gainEnergy(src,12);src.basicHits=(src.basicHits||0)+1;}
}
function healUnit(src,tgt,amt,opts){
 opts=opts||{};if(!tgt.alive)return 0;
 if(!opts.noScale){const cut=buffMax(tgt,'healCut');let bonus=1+(src?src.healPct||0:0)/100;
  if(src&&src.hid==='shange'&&tgt.hp<tgt.maxHp*0.4)bonus*=1.15;
  if(B&&B.relics&&B.relics.heal&&tgt.side===0)bonus*=1.10; // 迷雾远征遗物：治疗+10%
  amt=amt*bonus*(1-cut);}
 amt=Math.floor(amt);const real=Math.min(amt,tgt.maxHp-tgt.hp);
 tgt.hp+=real;if(src)src.stats.heal+=real;
 if(real>0)B.events.push({k:'heal',uid:tgt.uid,val:real});
 checkHelingPassive(tgt);
 return real;
}
function checkHelingPassive(tgt){
 const h=B.units.find(u=>u.hid==='heling'&&u.alive);
 if(!h||h.flags.hpUsed)return;
 const low=B.units.find(u=>u.side===0&&u.alive&&u.hp<u.maxHp*0.25);
 if(low){h.flags.hpUsed=true;healUnit(h,low,effAtk(h)*1.2*skMul(h,'passive'));B.log.push('荷铃「随身药袋」为 '+low.name+' 紧急包扎');B.events.push({k:'cast',uid:h.uid});}
}
function killHook(src,tgt){
 if(src.hid==='qiren'&&(!src.flags.killCd||B.t>=src.flags.killCd)){src.flags.killCd=B.t+3000;gainEnergy(src,15);B.log.push('鳍刃「收尾工作」+15 能量');}
}
function xingkuiShieldBreak(u){
 if(u.flags.xkCd&&B.t<u.flags.xkCd)return;u.flags.xkCd=B.t+8000;
 healUnit(u,u,u.maxHp*0.04,{noScale:true});B.log.push('星盔「认真过头」护盾碎裂，恢复生命');
}
function skMul(u,which){const lv=u.skLv?u.skLv[which]||1:1;return 1+(lv-1)*0.08;}
function lowestPct(units){return units.filter(u=>u.alive).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];}
function pickBasicTarget(u){
 const foes=aliveUnits(1-u.side);if(!foes.length)return null;
 const tb=u.buffs.find(b=>b.type==='taunted'&&B.t<b.until);
 if(tb){const tu=unitByUid(tb.val);if(tu&&tu.alive)return tu;}
 if(u.side===0&&B.focus){const f=unitByUid(B.focus);if(f&&f.alive)return f;}
 const front=foes.filter(x=>x.pos<2);
 return (front.length?front:foes).sort((a,b)=>a.pos-b.pos)[0];

function heroActive(u){
 const m=skMul(u,'active'),allies=aliveUnits(0),foes=aliveUnits(1);
 switch(u.hid){
  case 'taidun':{foes.forEach(f=>addBuff(f,'taunted',u.uid,2,u));addShield(u,u.maxHp*0.12,5,u,'hero_taidun');return true;}
  case 'heling':{const t=lowestPct(allies);if(!t||t.hp/t.maxHp>0.9)return false;healUnit(u,t,effAtk(u)*1.8*m);sfx.heal();return true;}
  case 'yexian':{for(let i=0;i<3;i++){let t=pickBasicTarget(u);if(!t)break;dealDamage(u,t,0.65*m,'phys',{direct:true});}return true;}
  case 'maoya':{addBuff(u,'dmgRed',0.25,4,u);u.flags.counter=2;u.flags.counterUntil=B.t+4000;return true;}
  case 'baoli':{const t=pickBasicTarget(u);if(!t)return false;foes.filter(f=>Math.floor(f.pos/2)===Math.floor(t.pos/2)||(f.pos<2)===(t.pos<2)).forEach(f=>{dealDamage(u,f,1.3*m,'mag',{direct:true});applyBurn(u,f,m);});return true;}
  case 'tongshao':{allies.filter(a=>a!==u).concat([u]).sort((a,b)=>effAtk(b)-effAtk(a)).slice(0,2).forEach(a=>addBuff(a,'atkPct',0.12,5,u));return true;}
  case 'paopaoli':{const t=foes.slice().sort((a,b)=>effSpd(b)-effSpd(a))[0];if(!t)return false;dealDamage(u,t,1.5*m,'mag',{direct:true});addBuff(t,'slow',-0.20,4,u);addBuff(t,'mresDown',0.10,4,u);return true;}
  case 'qiren':{const back=foes.filter(f=>f.pos>=2);const t=lowestPct(back.length?back:foes);if(!t)return false;dealDamage(u,t,1.9*m,'phys',{direct:true});return true;}
  case 'shange':{const ts=allies.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp).slice(0,2);ts.forEach(t=>healUnit(u,t,effAtk(u)*1.2*m));sfx.heal();return true;}
  case 'dengyu':{const ts=allies.filter(a=>a!==u).sort((a,b)=>a.energy-b.energy).slice(0,2);ts.forEach(t=>gainEnergy(t,12));return true;}
  case 'yefeng':{const t=foes.slice().sort((a,b)=>effAtk(b)-effAtk(a))[0];if(!t)return false;dealDamage(u,t,1.6*m,'phys',{direct:true});addBuff(t,'mark',0,5,u,{srcName:'yefeng'});u.flags.markUid=t.uid;return true;}
  case 'xingkui':{const t=lowestPct(allies);if(!t)return false;addBuff(t,'dmgRed',0.15,4,u);return true;}
 }
 return false;
}
function applyBurn(u,f,m){
 const before=f.buffs.some(b=>b.type==='burn'&&b.src===u.uid);
 addBuff(f,'burn',0.18*(m||1),4+((B&&B.relics&&B.relics.burn)?1:0),u,{tickSrc:u.uid}); // 遗物：灼烧+1秒
 if(u.hid==='baoli'){const w=Math.floor(B.t/1000);if(u._burnWin!==w){u._burnWin=w;u._burnGot=0;}if(u._burnGot<6){gainEnergy(u,2);u._burnGot+=2;}}

function heroUlt(u){

function dispelOne(u){

}

 }

 mod=mod||'';const isBoss=eid==='BOSS';

 const g1=1+0.058*(lv-1),g2=1+0.05*(lv-1),g3=1+0.042*(lv-1);
 let mm=1;if(mod==='elite')mm=1.45;if(mod==='strong')mm=1.25;
 const hp=Math.floor(def.base[0]*g1*mm*1.15*(isBoss?1.25:1)),atk=Math.floor(def.base[1]*g2*mm*1.3);

  maxHp:hp,atk:atk,armor:Math.floor(def.base[2]*g3*mm),mres:Math.floor(def.base[3]*g3*mm),spd:def.base[4],int:def.base[5],
  kind:isBoss?'boss':def.kind,isBoss:isBoss,bossKey:isBoss?(B?B.bossKey:null):null,lv:lv,cd0:isBoss?6000:3500+pos*400,bossCd:8000,summoned:0,cloneAt:{a:false,b:false}});
 return u;

function assignPos(list){ // list 项含 row 偏好（0前排/1后排），分配到 0,1 前排与 2,3,4 后排
 const front=[0,1],back=[2,3,4],out=[];
 list.forEach(e=>{let pos;
  if(e.row===0&&front.length)pos=front.shift();
  else if(e.row===1&&back.length)pos=back.shift();
  else if(front.length)pos=front.shift();
  else if(back.length)pos=back.shift();
  else return;
  out.push(Object.assign({},e,{pos:pos}));});
 return out;
}

function bossTick(u){
 const foes=aliveUnits(0);
 if(u.eid!=='BOSS')return;
 if(u.bossKey==='1'){
  if(!u.flags.halfShield&&u.hp<u.maxHp*0.5){u.flags.halfShield=true;addShield(u,u.maxHp*0.15,6,u,'boss');B.log.push('荆冠巨獾「荆棘缩身」获得护盾');}
  if(u.flags.nextSweep==null)u.flags.nextSweep=B.t+10000;
  if(!u.cast&&B.t>=u.flags.nextSweep){u.cast={name:'横扫别挡路',start:B.t,dur:1200,until:B.t+1200,interruptible:true,breakNeed:Math.floor(u.maxHp*CAST_BREAK.pct),breakGot:0,fn:()=>{foes.filter(f=>f.pos<2).forEach(f=>dealDamage(u,f,1.9,'phys',{direct:true}));B.log.push('荆冠巨獾横扫前排！');}};B.events.push({k:'castwarn',uid:u.uid,name:'横扫别挡路',interruptible:true});u.flags.nextSweep=B.t+11200;}
 }
 if(u.bossKey==='2'){
  if(!u.flags.nextShield||B.t>=u.flags.nextShield){u.flags.nextShield=B.t+12000;addShield(u,u.maxHp*0.18,8,u,'boss2');addBuff(u,'atkPct',0.10,8,u);B.log.push('锅炉王「压力过高」升起护盾');}
  const sn=u.flags.summonAt||25000;
  if(B.t>=sn&&(u.summoned||0)<2){if(aliveUnits(1).length<5){u.summoned=(u.summoned||0)+1;u.flags.summonAt=B.t+30000;
   const bot=enemyUnit('E04',u.lv,'',Math.min(4,aliveUnits(1).length));bot.name='维修机';bot.kind='healer';bot.art=enemyArt('E05');B.units.push(bot);B.events.push({k:'summon',unit:bot});B.log.push('锅炉王召唤了维修机！');}
   else u.flags.summonAt=B.t+4000;}
 }
 if(u.bossKey==='3'){
  if(!u.flags.nextSalt||B.t>=u.flags.nextSalt){u.flags.nextSalt=B.t+9000;
   foes.filter(f=>f.pos>=2).forEach(f=>{dealDamage(u,f,1.3,'mag',{direct:true});addBuff(f,'healCut',0.30,5,u);});
   B.log.push('潮眼巨蟹「海盐伤口」划伤后排，治疗被削减');}
  if(!u.flags.nextTide||B.t>=u.flags.nextTide){u.flags.nextTide=B.t+15000;
   foes.forEach(f=>{dealDamage(u,f,0.7,'mag',{direct:true});addBuff(f,'slow',-0.15,4,u);});
   B.log.push('潮眼巨蟹「退潮拉扯」拖慢了全队');}
 }
 if(u.bossKey==='4'){
  [['a',0.7],['b',0.35]].forEach(([k,th])=>{if(!u.cloneAt[k]&&u.hp<u.maxHp*th){u.cloneAt[k]=true;
   if(aliveUnits(1).length<=3){for(let i=0;i<2;i++){const c=enemyUnit('E09',u.lv,'',aliveUnits(1).length);c.name='观星者分身';c.art=enemyArt('B4');c.maxHp=Math.floor(u.maxHp*0.18);c.hp=c.maxHp;c.atk=Math.floor(u.atk*0.45);c.kind='basic';c.isBoss=false;B.units.push(c);B.events.push({k:'summon',unit:c});}
    B.log.push('失眠观星者分出两个分身——真身星盘有金色纹路！');}else{u.cloneAt[k]=false;}}});
  if(!u.cast&&(!u.flags.nextMeteor||B.t>=u.flags.nextMeteor)){const canBreak=u.hp>=u.maxHp*0.35;u.cast={name:'熬夜流星',start:B.t,dur:1500,until:B.t+1500,interruptible:canBreak,breakNeed:canBreak?Math.floor(u.maxHp*CAST_BREAK.pct):0,breakGot:0,fn:()=>{foes.slice().sort(()=>B.rng()-0.5).slice(0,3).forEach(f=>dealDamage(u,f,1.5,'mag',{direct:true}));B.log.push('熬夜流星坠落！');}};B.events.push({k:'castwarn',uid:u.uid,name:'熬夜流星',interruptible:canBreak});u.flags.nextMeteor=B.t+11000;}
 }
}
/* ---------------- 模拟步进 ---------------- */
function simStep(){
 if(!B||B.over)return;
 B.t+=100;
 // 护盾到期处理（铜哨被动「修修还能用」：铜哨大招护盾自然到期时，持有者恢复剩余盾值30%生命；被击破/驱散不触发）
 B.units.forEach(u=>{if(!u.alive)return;
  u.shields.forEach(sh=>{if(B.t>=sh.until&&sh.amt>0&&sh.tag==='ult_tongshao'){const ts=unitByUid(sh.src);const amt=Math.floor(sh.amt*0.3);if(amt>0){healUnit(ts&&ts.alive?ts:u,u,amt,{noScale:true});B.log.push('铜哨「修修还能用」：'+u.name+' 的护盾自然到期，恢复 '+amt+' 生命');}}});
  u.shields=u.shields.filter(sh=>B.t<sh.until&&sh.amt>0);
  u.buffs=u.buffs.filter(b=>B.t<b.until);
 });
 B.units.forEach(u=>{if(!u.alive)return;
  // DoT / HoT
  u.buffs.slice().forEach(b=>{
   if((b.type==='burn'||b.type==='poison')&&B.t>=b.nextTick){b.nextTick+=1000;const src=unitByUid(b.tickSrc||b.src);
    if(src){const savedAtk=src.atk;const r=calcDamage(src,u,b.val*(b.stacks||1),'mag',{dot:true});applyDamage(src,u,r.dmg,{dot:true});B.events.push({k:'dmg',uid:u.uid,val:r.dmg,kind:'dot'});}}
   if(b.type==='hot'&&B.t>=b.nextTick){b.nextTick+=1000;const src=unitByUid(b.tickSrc||b.src);if(src)healUnit(src,u,effAtk(src)*b.val*skMul(src,'ult'));}
  });
  // 蓄力
  if(u.cast){
   if(hasBuff(u,'stun')&&u.cast.interruptible!==false){B.log.push(u.name+' 的「'+u.cast.name+'」被眩晕打断！');u.cast=null;B.events.push({k:'interrupt',uid:u.uid,via:'stun'});}
   else if(B.t>=u.cast.until){const fn=u.cast.fn;u.cast=null;fn();}
  }
  if(!u.alive||hasBuff(u,'stun'))return;
  // 铆牙反击
  u.cd-=100;u.atkT-=100;
  bossTick(u);
  if(hasBuff(u,'silence')){/* 沉默：不能主动/大招 */}
  else if(u.cd<=0){
   let casted=false;
   if(u.side===0)casted=heroActive(u);else if(u.kind==='boss')casted=false;else casted=enemyActive(u);
   if(casted){u.cd=(u.side===0?(HEROES[u.hid].sk.active.cd||8):enemyCd(u))*1000;B.events.push({k:'cast',uid:u.uid});}
   else u.cd=600;
  }
  // 自动大招
  if(u.side===0&&B.autoUlt&&u.energy>=100&&!hasBuff(u,'silence')&&!hasBuff(u,'stun')){u.energy=0;heroUlt(u);}
  // 普攻
  if(u.atkT<=0){
   const t=pickBasicTarget(u);
   if(t){
    let mult=1;
    if(u.side===0){const H=HEROES[u.hid];mult=H.sk.basic.d.includes('80%')?0.8:H.sk.basic.d.includes('95%')?0.95:H.sk.basic.d.includes('90%')?0.9:1;
     if(u.hid==='yexian'&&(u.basicHits+1)%5===0)mult*=1.4;
     const type=(u.hid==='heling'||u.hid==='paopaoli'||u.hid==='shange'||u.hid==='dengyu')?'mag':'phys';
     dealDamage(u,t,mult,type,{direct:true,basic:true});}
    else{const type=(u.kind==='drain'||u.kind==='slow'||u.kind==='burner')?'mag':'phys';dealDamage(u,t,1,type,{direct:true,basic:true});}
    B.events.push({k:'attack',uid:u.uid,tgt:t.uid});
    u.atkT=u.int*1000*100/Math.max(30,effSpd(u));
   } else u.atkT=300;
  }
 });
 // 铆牙反击结算：记录在受击时处理（简化：每步检查最近受击）
 B.units.forEach(u=>{if(u.hid==='maoya'&&u.flags.counter>0&&u.flags.lastAttacker){const a=unitByUid(u.flags.lastAttacker);
  if(a&&a.alive&&B.t<u.flags.counterUntil){u.flags.counter--;u.flags.lastAttacker=null;dealDamage(u,a,0.8*skMul(u,'active'),'phys',{direct:true});B.log.push('铆牙反击！');}}});
 // 胜负
 const heroesAlive=aliveUnits(0).length,foesAlive=aliveUnits(1).length;
 if(heroesAlive===0&&foesAlive===0)endBattle(false,'draw');
 else if(foesAlive===0)endBattle(true,'win');
 else if(heroesAlive===0)endBattle(false,'lose');
 else if(B.t>=90000)endBattle(false,'timeout');
}
function enemyCd(u){return {basic:9999,bite:8,backshot:8,healer:7,shieldbot:10,burner:8,slow:8,taunt:9,drain:8,buffer:9}[u.kind]||9;}
// 受击记录（供铆牙反击与统计）
const _applyDamage=applyDamage;
applyDamage=function(src,tgt,dmg,opts){
 if(tgt.hid==='maoya'&&tgt.flags.counter>0&&src&&src.side===1&&!(opts&&opts.dot))tgt.flags.lastAttacker=src.uid;
 return _applyDamage(src,tgt,dmg,opts);
};

 if(B.onEnd)B.onEnd(B.result);
}

 }

/* 触屏拖拽：HTML5 drag 在手机上不触发，用 Pointer Events 实现同一套落点逻辑 */
let _pd=null,_pghost=null,_pMoved=false,_suppressClickUntil=0;
function formPointerDown(e,kind,val){if(e.pointerType==='mouse')return;_pd={kind:kind,val:val,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};_pMoved=false;}
document.addEventListener('pointermove',function(e){
 if(!_pd)return;_pd.x=e.clientX;_pd.y=e.clientY;
 if(!_pMoved){if(Math.hypot(e.clientX-_pd.sx,e.clientY-_pd.sy)<9)return;_pMoved=true;}
 if(!_pghost){_pghost=document.createElement('div');_pghost.id='dragghost';const art=_pd.kind==='hero'?heroArt(_pd.val):(S.formation[_pd.val]?heroArt(S.formation[_pd.val]):'');_pghost.innerHTML=art;document.body.appendChild(_pghost);}
 _pghost.style.left=e.clientX+'px';_pghost.style.top=e.clientY+'px';

function recommendForm(){

 const tank=byRole('坦克')[0],heal=byRole('治疗')[0],sup=byRole('辅助')[0];

 add(tank);add(heal);add(dps[0]);add(dps[1]);

 add(sup&&!used.has(sup)?sup:rest[0]);if(pick.length<5)add(rest.find(id=>!used.has(id)));

 while(front.length<2&&back.length>3)front.push(back.shift());
 S.formation=[front[0]||null,front[1]||null,back[0]||null,back[1]||null,back[2]||null];
 save();render();
 const el=$('#recwhy');if(el)el.innerHTML='推荐理由：'+(tank?'坦克 '+HEROES[tank].name+' 扛线；':'无坦克，')+(heal?'治疗 '+HEROES[heal].name+' 保续航；':'无治疗，')+'输出 '+(dps.slice(0,2).map(id=>HEROES[id].name).join('、')||'不足')+'；其余按战力与羁绊补位。推荐不保证必胜，请按关卡机制调整。';

}

 +'<div class="panel"><b>星尘季</b><div class="mut" style="margin:4px 0">本期：'+SEASON.period+'。坠落的星尘凝成了新的试炼：打通 5 个活动关卡赢星尘，在兑换商店换奖励与外观。</div><div class="mut">本地单机活动：进度与兑换只保存在本机存档；不设排行榜、不显示在线人数。</div>'
 +'<div class="kv"><span>✦ 星尘</span><b>'+(S.res.stardust||0)+'</b></div><div class="kv"><span>外观解锁券</span><b>'+(S.res.skinTicket||0)+'</b></div></div>'
 +'<div class="panel"><b>活动关卡</b>'+rows+'</div>'
 +'<div class="panel"><b>星尘兑换商店</b><div class="shopgrid" style="margin-top:8px">'+shop+'</div><div class="mut" style="margin-top:6px">兑换即时结算并记录次数，余额不足不能兑换。指定外观兑换后到对应英雄详情里穿戴；也可以用外观解锁券在任意英雄详情直接解锁其外观。</div></div>'
 +'</div>';
}
/* ---------------- 迷雾远征（P2 §32）：7 节点 / 生命继承 / 遗物三选一 ---------------- */
const RELICS=[
 {id:'shield',n:'月光盾徽',d:'本次远征内，我方护盾量 +15%'},
 {id:'firstUlt',n:'回响铃',d:'每场战斗首次释放大招返还 10 能量'},
 {id:'heal',n:'春泉叶',d:'本次远征内，我方受到的治疗 +10%'},
 {id:'frontHp',n:'磐根纹章',d:'本次远征内，前排英雄生命上限 +12%'},
 {id:'burn',n:'长明引线',d:'本次远征内，我方灼烧持续时间 +1 秒'},
 {id:'killHeal',n:'归林结',d:'本次远征内，英雄击杀敌人时恢复自身 6% 生命'},
 {id:'openRed',n:'晨雾斗篷',d:'每场战斗开局 5 秒，我方减伤 15%'}
];
const EXP_NODES=[
 {t:'battle',n:'雾中遭遇'},{t:'event',n:'雾中岔路'},{t:'battle',n:'藤蔓哨站'},{t:'camp',n:'雾中营地'},
 {t:'supply',n:'补给驿站'},{t:'battle',n:'雾兽巢穴',elite:true},{t:'boss',n:'雾心守卫'}
];
function expLv(){return Math.min(42,4+highestStageIdx());}
function expRelicFlags(){const f={};(S.exp.relics||[]).forEach(r=>f[r]=true);return f;}
function expAliveHeroes(){return S.formation.filter(id=>id&&(S.exp.hp[id]||0)>0);}
function startExpedition(){
 if(!S.formation.some(Boolean)){toast('阵容为空，先去编队上阵英雄');go('formation');return;}
 const hp={};S.formation.filter(Boolean).forEach(id=>hp[id]=1);
 S.exp={active:true,node:0,hp:hp,relics:[],supply:2,gains:{gold:0,exp:0,book:0},equips:[],nodeDone:{},eventStep:0,relicChoices:[],pendingRelic:false,done:false};
 save();render();toast('迷雾远征开始！队伍生命将逐节点继承');
}
function expEnemies(node,variant){
 const lv=expLv()+node;
 const mk=(eid,mod)=>({eid:eid,lv:lv,mod:mod||'',row:ENEMIES[eid].row});
 if(EXP_NODES[node].t==='boss'){const bk=''+clamp(1+Math.floor(highestStageIdx()/10),1,4);
  return assignPos([{eid:'BOSS',lv:lv+2,mod:'',row:0,bossKey:bk},mk('E09'),mk('E10')]);}
 const sets=[['E02','E01','E03'],['E05','E06','E02'],['E08','E07','E04'],['E09','E10','E05']];
 const set=sets[node%sets.length];
 if(variant==='weak')return assignPos(set.slice(0,2).map(e=>mk(e)));
 if(variant==='hard')return assignPos(set.map((e,i)=>mk(e,i===0?'strong':'')));
 if(EXP_NODES[node].elite)return assignPos(set.map((e,i)=>mk(e,i===0?'elite':'')));
 return assignPos(set.map(e=>mk(e)));
}
function startExpBattle(variant,sub){
 if(!expAliveHeroes().length){toast('全队已倒下，无法战斗');return;}
 const node=S.exp.node,nd=EXP_NODES[node],isBoss=nd.t==='boss';
 openBattle({kind:'exp',ref:node,title:'迷雾远征 · '+(sub?(sub==='signHard'?'路牌·危险路':'路牌·安全路'):nd.n),
  seedStr:'exp'+node+'_'+(sub||variant||'')+'_'+Date.now(),enemies:expEnemies(node,variant),
  bossKey:isBoss?(''+clamp(1+Math.floor(highestStageIdx()/10),1,4)):null,
  bg:isBoss?CHAPTERS[clamp(Math.floor(highestStageIdx()/10),0,3)].bg:'assets/bg-forest.webp',
  parTime:60000,relics:expRelicFlags(),hpMap:Object.assign({},S.exp.hp),expVariant:variant||'',expSub:sub||''});
}
function expGrantEnd(rate){
 const E=S.exp,g={};Object.keys(E.gains).forEach(k=>g[k]=Math.floor((E.gains[k]||0)*rate));
 addRes(g);E.equips.forEach(e=>S.equips.push(e));
 E.active=false;E.pendingRelic=false;E.relicChoices=[];passAddXp(40);
 return g;
}
function settleExpedition(res){
 const E=S.exp;
 B.units.filter(u=>u.side===0).forEach(u=>{E.hp[u.hid]=u.alive?clamp(u.hp/u.maxHp,0,1):0;});
 const statsRows=res.stats.map(s=>'<tr><td>'+s.name+(s.side===1?'（敌）':'')+'</td><td>'+fmt(s.dmg)+'</td><td>'+fmt(s.heal)+'</td><td>'+fmt(s.taken)+'</td><td>'+(s.alive?'存活':'倒下')+'</td></tr>').join('');
 const table='<table class="stats"><tr><th>单位</th><th>伤害</th><th>治疗</th><th>承伤</th><th>状态</th></tr>'+statsRows+'</table>';
 if(!res.win){
  const g=expGrantEnd(0.5);bump('expRuns');save();renderTop();
  openModal('<div class="resultbig lose">远 征 失 败</div><div style="text-align:center" class="mut">用时 '+Math.round(res.t/1000)+' 秒</div>'+table
   +'<p class="mut">远征在此止步。按规则保留部分收益：资源按 50% 结算（'+rewText(g)+'），途中获得的装备保留；主线资源、英雄与装备不受任何影响。</p>'
   +'<div class="btnrow" style="margin-top:10px"><button class="btn green" onclick="closeModal();closeBattle();go(\'adventure\')">返回冒险</button><button class="btn blue" onclick="closeModal();closeBattle();go(\'expedition\')">远征营地</button></div>');
  sfx.lose();return;
 }
 const sub=B.cfg&&B.cfg.expSub,node=E.node,nd=EXP_NODES[node];
 let g,note='';
 if(sub){g=sub==='signHard'?{gold:170,exp:115,book:1}:{gold:65,exp:42,book:0};E.eventStep=2;note='路牌事件完成。';}
 else if(nd.t==='boss'){g={gold:420,exp:280,book:2};const slots=['weapon','armor','trinket','boots'];E.equips.push(newEquip(slots[Math.floor(Math.random()*4)],'稀有',1+highestStageIdx()*0.03));}
 else{g={gold:90+node*35,exp:55+node*22,book:node>=4?1:0};if(nd.elite){g.gold=Math.round(g.gold*1.6);g.exp=Math.round(g.exp*1.6);}if(B.cfg&&B.cfg.expVariant==='hard'){g.gold*=2;g.exp*=2;}}
 Object.keys(g).forEach(k=>E.gains[k]=(E.gains[k]||0)+g[k]);
 if(nd.t==='boss'&&!sub){
  const eqNames=E.equips.map(e=>e.name+'（'+e.qual+'）').join('、');
  const granted=expGrantEnd(1);E.done=true;bump('expRuns');save();renderTop();
  openModal('<div class="resultbig win">远 征 完 成</div><div style="text-align:center" class="mut">雾心守卫已被击败 · 用时 '+Math.round(res.t/1000)+' 秒</div>'+table
   +'<p class="mut">本次远征收益全部结算：'+rewText(granted)+(eqNames?'；装备：'+eqNames:'')+'。遗物与生命继承随远征结束清空，不写入永久属性。</p>'
   +'<div class="btnrow" style="margin-top:10px"><button class="btn green" onclick="closeModal();closeBattle();go(\'expedition\')">再来一轮</button><button class="btn ghost" onclick="closeModal();closeBattle();go(\'adventure\')">返回冒险</button></div>');
  sfx.win();return;
 }
 if(!sub){
  const pool=RELICS.filter(r=>!E.relics.includes(r.id));
  if(pool.length){E.relicChoices=pool.slice().sort(()=>Math.random()-0.5).slice(0,3).map(r=>r.id);E.pendingRelic=true;}
  else{E.supply+=1;E.node++;}
 }
 save();renderTop();
 openModal('<div class="resultbig win">节 点 通 过</div><div style="text-align:center" class="mut">用时 '+Math.round(res.t/1000)+' 秒 · 队伍生命已继承</div>'+table
  +'<p class="mut">'+note+'本节点收益记入待结算：'+rewText(g)+'（远征完成全额结算，失败保留 50%）。</p>'
  +'<div class="btnrow" style="margin-top:10px"><button class="btn green" style="flex:1" onclick="closeModal();closeBattle();go(\'expedition\')">'+(E.pendingRelic?'去选择遗物':'继续前进')+'</button><button class="btn" onclick="retryBattle()">再来一场</button></div>');
 sfx.win();
}
function pickRelic(id){const E=S.exp;if(!E.pendingRelic)return;E.relics.push(id);E.pendingRelic=false;E.relicChoices=[];E.node++;save();render();toast('获得遗物：'+((RELICS.find(r=>r.id===id)||{}).n||''));}
function expGoNext(){S.exp.node++;save();go('expedition');}
function campHeal(){const E=S.exp;if(E.nodeDone['camp'+E.node]){toast('本次营地休整已用过');return;}E.nodeDone['camp'+E.node]=true;S.formation.filter(Boolean).forEach(id=>{if(E.hp[id]>0)E.hp[id]=Math.min(1,E.hp[id]+0.4);});save();render();toast('营地休整：存活英雄恢复 40% 生命');}
function campRevive(id){const E=S.exp;if(E.hp[id]>0)return;if(E.supply<1){toast('远征补给不足（复活需要 1 点）');return;}E.supply--;E.hp[id]=0.5;save();render();toast(HEROES[id].name+' 在营地苏醒，恢复 50% 生命');}
function supplyClaim(){const E=S.exp;if(E.nodeDone['supply'+E.node])return;E.nodeDone['supply'+E.node]=true;E.supply+=2;E.gains.gold+=60;E.gains.exp+=40;save();render();toast('领取补给：补给 +2，金币 60 / 经验 40 记入待结算收益');}
function cartChoice(c){const E=S.exp;if(E.eventStep!==0)return;
 if(c==='equip'){if(E.supply<2){toast('远征补给不足（需要 2 点）');return;}E.supply-=2;const slots=['weapon','armor','trinket','boots'];const e=newEquip(slots[Math.floor(Math.random()*4)],Math.random()<0.5?'优秀':'稀有',1+highestStageIdx()*0.03);E.equips.push(e);toast('推车修好，车主赠送装备：'+e.name+'（远征结算时入包）');}
 if(c==='repair'){S.formation.filter(Boolean).forEach(id=>{if(E.hp[id]>0)E.hp[id]=Math.min(1,E.hp[id]+0.25);});toast('一起修好推车，顺带休整：存活英雄恢复 25% 生命');}
 if(c==='leave')toast('绕开了坏掉的推车，继续前进');
 E.eventStep=1;save();render();}
function signSkip(){if(S.exp.eventStep!==1)return;S.exp.eventStep=2;save();render();toast('记下路牌位置，绕行通过（无收益）');}
function expAbandonAsk(){openModal('<h3>结束本次远征？</h3><p class="mut">主动撤退将按 100% 结算已累积的待结算收益与装备；队伍生命继承与遗物随本次远征结束清空（从未写入英雄永久属性）。</p><div class="btnrow"><button class="btn red" onclick="expAbandon()">确认撤退</button><button class="btn ghost" onclick="closeModal()">继续远征</button></div>');}

function expFailOut(){const g=expGrantEnd(0.5);bump('expRuns');save();renderTop();go('adventure');toast('全队倒下，远征结束，保留 50% 收益：'+rewText(g));}

 let nodeHtml='';

 bar.innerHTML=B.units.filter(u=>u.side===0).map(u=>'<button class="ultbtn" id="ult-'+u.uid+'" onclick="manualUlt(\''+u.uid+'\')"><div class="uart">'+u.art+'</div><div class="enwrap"><i style="width:'+u.energy+'%"></i></div><small>'+u.name+' · '+HEROES[u.hid].sk.ult.n+'</small></button>').join('');
}
function manualUlt(uid){
 const u=unitByUid(uid);if(!u||!u.alive||B.over||B.paused)return;
 if(u.energy<100){toast(u.name+' 能量 '+Math.floor(u.energy)+'/100，还不能放大招');return;}
 if(hasBuff(u,'silence')){toast(u.name+' 被沉默，无法放大招');return;}
 if(hasBuff(u,'stun')){toast(u.name+' 被眩晕，无法行动');return;}
 u.energy=0;sfx.ult();heroUlt(u);B.ultUsed=(B.ultUsed||0)+1;consumeEvents();
}
function cycleSpeed(){B.speed=B.speed>=3?1:B.speed+1;$('#bspd').textContent=B.speed+'×';sfx.click();}
function toggleAutoUlt(){B.autoUlt=!B.autoUlt;$('#bauto').classList.toggle('on',B.autoUlt);sfx.click();}
function togglePause(){if(!B||B.over)return;B.paused=!B.paused;$('#bpause').textContent=B.paused?'继续':'暂停';sfx.click();}
function retreatBattle(){if(!B)return;B._wasPaused=B.paused;B.paused=true;openModal('<h3>确认撤退？</h3><p class="mut">撤退不会获得任何奖励，战斗进度不保存。（弹窗期间战斗已暂停）</p><div class="btnrow"><button class="btn red" onclick="closeModal();closeBattle();render()">确认撤退</button><button class="btn ghost" onclick="closeModal();if(B)B.paused=B._wasPaused">继续战斗</button></div>');}
function closeBattle(){clearInterval(battleTimer);battleTimer=null;document.removeEventListener('visibilitychange',visPause);$('#battlewrap').classList.remove('open');$('#battlewrap').innerHTML='';B=null;unitEls={};}
function blog(msg){const l=$('#blog');if(!l)return;const d=document.createElement('div');d.textContent='› '+msg;l.appendChild(d);while(l.children.length>30)l.firstChild.remove();l.scrollTop=l.scrollHeight;}
function floater(u,txt,cls){
 const f=$('#bfield'),el=unitEls[u.uid];if(!f||!el)return;
 const d=document.createElement('div');d.className='floater '+(cls||'');d.textContent=txt;
 d.style.left='calc('+el.style.left+' + '+(Math.random()*36-30)+'px)';d.style.top='calc('+el.style.top+' - 6px)';
 f.appendChild(d);setTimeout(()=>d.remove(),880);
}
function animEl(uid,cls){const el=unitEls[uid];if(!el)return;const img=el.querySelector('.uimg');img.classList.remove(cls);void img.offsetWidth;img.classList.add(cls);setTimeout(()=>img.classList.remove(cls),520);}
/* 角色动作差异化（P2）：近战大步突进回位；远程/治疗/辅助发射弹道（颜色按攻击者阵营，治疗为绿、辅助为金）；
   治疗落点升起绿色光柱；辅助施法扩散光环；大招释放者放大高亮 + 专属金色冲击波。
   低特效（设置「特效表现」关）时：弹道保留但更小无辉光、近战用短突进，光柱/光环/冲击波省略，类别仍可区分。 */
const FAC_COLOR={'森芽':'#7fc95e','熔炉':'#f08a3c','潮汐':'#4E9CCB','星灯':'#a78bfa'};
function atkStyle(u){
 if(u.side===0){const r=HEROES[u.hid]?HEROES[u.hid].role:'';if(r==='坦克'||r==='刺客')return 'melee';if(r==='治疗')return 'heal';if(r==='辅助')return 'sup';return 'shot';}
 return ['backshot','burner','slow','drain','buffer','healer'].indexOf(u.kind)>=0?'shot':'melee';
}
function spawnProj(a,t,st){
 const f=$('#bfield'),ae=unitEls[a.uid],te=unitEls[t.uid];if(!f||!ae||!te)return;
 const fx=S.settings.flash;
 const d=document.createElement('div');d.className='proj'+(fx?'':' sm');
 const col=st==='heal'?'#69e58a':st==='sup'?'#ffd977':(FAC_COLOR[a.fac]||'#ffffff');
 d.style.background=col;d.style.color=col;
 d.style.left=ae.style.left;d.style.top='calc('+ae.style.top+' - 12px)';
 f.appendChild(d);
 requestAnimationFrame(()=>{requestAnimationFrame(()=>{d.style.left=te.style.left;d.style.top='calc('+te.style.top+' - 12px)';});});
 setTimeout(()=>d.remove(),fx?330:270);
}
function spawnBeam(u){const el=unitEls[u.uid];if(!el)return;const d=document.createElement('div');d.className='healbeam';el.appendChild(d);setTimeout(()=>d.remove(),680);}
function spawnAura(u,col,big){const el=unitEls[u.uid];if(!el)return;const d=document.createElement('div');d.className='aura'+(big?' big':'');d.style.borderColor=col;el.appendChild(d);setTimeout(()=>d.remove(),700);}
function ultFx(u){const el=unitEls[u.uid];if(!el)return;const img=el.querySelector('.uimg');if(img){img.classList.remove('ultzoom');void img.offsetWidth;img.classList.add('ultzoom');setTimeout(()=>img.classList.remove('ultzoom'),1000);}if(S.settings.flash)spawnAura(u,'#ffd23c',true);}
function consumeEvents(){
 if(!B)return;
 for(const ev of B.events){
  const u=unitByUid(ev.uid);
  if(ev.k==='dmg'&&u){floater(u,'-'+ev.val,ev.kind);animEl(ev.uid,'hitflash');if(ev.kind==='crit')sfx.hit();else if(S.settings.fx)sfx.hit();}
  if(ev.k==='heal'&&u){floater(u,'+'+ev.val,'heal');sfx.heal();if(S.settings.flash)spawnBeam(u);}
  if(ev.k==='absorb'&&u)floater(u,'盾-'+ev.val,'shield');
  if(ev.k==='shield'&&u){floater(u,'护盾','shield');sfx.shield();}
  if(ev.k==='attack'){const t=unitByUid(ev.tgt);const a=unitByUid(ev.uid);if(a&&t){const st=atkStyle(a);
   if(st==='melee')animEl(ev.uid,a.side===0?(S.settings.flash?'lungeR2':'lungeR'):(S.settings.flash?'lungeL2':'lungeL'));
   else spawnProj(a,t,st);}}
  if(ev.k==='cast'&&u){animEl(ev.uid,'castglow');if(S.settings.flash&&u.side===0&&HEROES[u.hid]&&HEROES[u.hid].role==='辅助')spawnAura(u,'#ffd977',false);}
  if(ev.k==='ult'){const bn=$('#ultbanner');if(bn){bn.innerHTML='<span class="ub-in"><span class="ub-who">'+ev.who+'</span>'+ev.skill+'</span>';bn.style.display='block';setTimeout(()=>bn.style.display='none',1100);}if(u)ultFx(u);}
  if(ev.k==='castwarn')blog(ev.interruptible===false?('注意：'+(u?u.name:'')+' 正在蓄力「'+ev.name+'」——不可打断阶段，破蓄与眩晕都无效！'):('注意：'+(u?u.name:'')+' 正在蓄力「'+ev.name+'」！点击它设为集火目标，全队直接伤害打满其最大生命 '+Math.round(CAST_BREAK.pct*100)+'% 即可破蓄打断（眩晕也可打断）'));
  if(ev.k==='interrupt')blog(ev.via==='focus'?'集火破蓄成功，蓄力被打断！':'蓄力被眩晕打断！');
  if(ev.k==='summon'&&ev.unit)addUnitEl(ev.unit);
 }
 B.events=[];
 while(B.log.length){const m=B.log.shift();blog(m);}
 refreshFocus();
}
function battleFrame(){
 if(!B)return;
 if(!B.paused&&!B.over){const steps=B.speed;for(let i=0;i<steps;i++)simStep();}
 consumeEvents();
 // 更新单位状态
 B.units.forEach(u=>{const el=unitEls[u.uid];if(!el)return;
  const hpPct=clamp(u.hp/u.maxHp*100,0,100),shAmt=u.shields.reduce((a,s)=>a+s.amt,0);
  const bar=el.querySelector('.hpbar i');if(bar){bar.style.width=hpPct+'%';bar.parentElement.classList.toggle('sh',shAmt>0);}
  const en=el.querySelector('.enbar i');if(en)en.style.width=u.energy+'%';
  el.classList.toggle('dead',!u.alive);
  const st=el.querySelector('.ustat');
  const sts=[];
  if(shAmt>0)sts.push('盾'+Math.round(shAmt));
  if(u.flags.weakUntil&&B.t<u.flags.weakUntil)sts.push('虚弱');
  if(u.cast)sts.push('蓄力中');
  if(hasBuff(u,'stun'))sts.push('眩晕');
  if(hasBuff(u,'silence'))sts.push('沉默');
  if(hasBuff(u,'burn'))sts.push('灼烧');
  if(hasBuff(u,'poison'))sts.push('中毒');
  if(hasBuff(u,'healCut'))sts.push('疗减');
  if(hasBuff(u,'slow'))sts.push('减速');
  if(u.isBoss&&u.bossKey==='4')sts.push('金纹真身');
  if(st)st.textContent=sts.join(' ');
  const cs=el.querySelector('.castslot');
  if(cs){if(u.cast){const total=u.cast.dur||(u.cast.until-(u.cast.start||0))||1200;const pct=clamp(100-(u.cast.until-B.t)/total*100,0,100);
   let h='<div class="castbar"><i style="width:'+pct+'%"></i></div>';
   if(u.cast.interruptible===false)h+='<div class="castlbl">不可打断！</div>';
   else if(u.cast.breakNeed>0){const bpct=clamp((u.cast.breakGot||0)/u.cast.breakNeed*100,0,100);
    h+='<div class="castbar brk"><i style="width:'+bpct+'%"></i></div><div class="castlbl">'+(B.focus===u.uid?('破蓄 '+Math.floor(bpct)+'%（集火中）'):'点击我设为集火，可破蓄打断')+'</div>';}
   cs.innerHTML=h;}else cs.innerHTML='';}
  const ub=$('#ult-'+u.uid);
  if(ub){ub.querySelector('.enwrap i').style.width=u.energy+'%';ub.classList.toggle('ready',u.alive&&u.energy>=100);ub.disabled=!u.alive;}
 });
 const tm=$('#btimer');if(tm)tm.textContent=Math.max(0,90-Math.floor(B.t/1000));
 if(B.over&&!B.settled){B.settled=true;clearInterval(battleTimer);setTimeout(()=>settleBattle(B.result),650);}
}

let bagTab='equip',bagSlot='全部';
function vBag(){
 const tabs='<div class="filters"><button class="'+(bagTab==='equip'?'on':'')+'" onclick="bagTab=\'equip\';render()">装备</button><button class="'+(bagTab==='mat'?'on':'')+'" onclick="bagTab=\'mat\';render()">材料与碎片</button></div>';
 if(bagTab==='mat'){
  const fragRows=HERO_IDS.filter(id=>(S.frags[id]||0)>0).map(id=>'<div class="itemrow"><div class="itemicon">'+ICONS.frag+'</div><div style="flex:1"><b>'+HEROES[id].name+' 碎片</b><div class="mut">用于升星 · 来源：招募重复英雄</div></div><b>×'+S.frags[id]+'</b>'+(S.heroes[id]?'<button class="btn sm" onclick="go(\'hero\',\''+id+'\')">去升星</button>':'<span class="mut">未获得英雄</span>')+'</div>').join('');
  return '<div class="page"><h2 class="ptitle">'+ICONS.bag+' 背包</h2>'+tabs+'<div class="panel">'
  +Object.keys(RESNAME).map(k=>'<div class="kv"><span>'+RESICON[k]+' '+RESNAME[k]+'</span><b>'+fmt(S.res[k])+'</b></div>').join('')
  +(fragRows||'<div class="emptybox">暂无英雄碎片</div>')+'</div></div>';
 }
 const slots=['全部','weapon','armor','trinket','boots'];
 let list=S.equips.filter(e=>bagSlot==='全部'||e.slot===bagSlot);
 list.sort((a,b)=>(a.hero?1:0)-(b.hero?1:0)||QUALsIdx(b.qual)-QUALsIdx(a.qual));
 const rows=list.map(e=>'<div class="itemrow" style="flex-direction:column;align-items:stretch;gap:7px"><div style="display:flex;gap:10px;align-items:center"><div class="itemicon q-'+e.qual+'" style="border-style:solid">'+SLOTS[e.slot].i+'</div><div style="flex:1;min-width:0"><b class="qname-'+e.qual+'">'+e.name+' +'+e.lv+'</b> <span class="tag">'+e.qual+' '+SLOTS[e.slot].n+'</span>'+(e.locked?' · 已锁定':'')+'<div class="mut">'+eqStatsText(e)+(e.hero?' · 装备于 '+HEROES[e.hero].name:'')+'</div></div></div>'
  +'<div class="btnrow" style="justify-content:flex-end">'
  +(e.hero?'<button class="btn sm" onclick="go(\'hero\',\''+e.hero+'\')">查看英雄</button>':'<button class="btn sm" onclick="openWearPicker(\''+e.uid+'\')">穿戴</button>')
  +'<button class="btn sm blue" onclick="doEnhance(\''+e.uid+'\')">强化 '+ICONS.stone+(1+e.lv)+' '+ICONS.coin+(30*(e.lv+1))+'</button>'
  +'<button class="btn sm ghost" onclick="toggleLock(\''+e.uid+'\')">'+(e.locked?'解锁':'锁定')+'</button>'
  +(!e.hero&&!e.locked?'<button class="btn sm red" onclick="doDismantle(\''+e.uid+'\')">分解</button>':'')
  +'</div></div>').join('');
 return '<div class="page"><h2 class="ptitle">'+ICONS.bag+' 背包 · 装备（'+S.equips.length+' 件）</h2>'+tabs
 +'<div class="filters">'+slots.map(s=>'<button class="'+(bagSlot===s?'on':'')+'" onclick="bagSlot=\''+s+'\';render()">'+(s==='全部'?'全部':SLOTS[s].n)+'</button>').join('')+'</div>'
 +'<div class="panel">'+(rows||'<div class="emptybox">暂无装备，去挂机、副本或主线获取吧</div>')
 +'<div class="btnrow" style="margin-top:10px"><button class="btn red" onclick="batchDismantle()">批量分解未穿戴的普通/优秀装备</button></div></div></div>';
}
function QUALsIdx(q){return QUALS.indexOf(q);}
function toggleLock(uid){const e=S.equips.find(x=>x.uid===uid);if(e){e.locked=!e.locked;save();render();}}
function openWearPicker(uid){
 const e=S.equips.find(x=>x.uid===uid);if(!e)return;
 const owned=HERO_IDS.filter(id=>S.heroes[id]);
 openModal('<h3>给谁穿戴「'+e.name+'」？</h3>'+owned.map(id=>'<div class="itemrow"><div class="mini44" style="width:44px;height:44px">'+heroArt(id)+'</div><div style="flex:1"><b>'+HEROES[id].name+'</b> <span class="mut">'+HEROES[id].role+' · 评分 '+eqScore(e,HEROES[id].role)+'</span></div><button class="btn sm" onclick="equipTo(\''+uid+'\',\''+id+'\');closeModal();render()">穿戴</button></div>').join('')+'<div class="btnrow" style="margin-top:8px"><button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function batchDismantle(){
 const list=S.equips.filter(e=>!e.hero&&!e.locked&&(e.qual==='普通'||e.qual==='优秀'));
 if(!list.length){toast('没有可批量分解的装备');return;}
 const gain=list.reduce((a,e)=>a+1+e.lv,0);
 openModal('<h3>批量分解确认</h3><p class="mut">将分解 '+list.length+' 件未穿戴、未锁定的普通/优秀装备，预计获得强化石×'+gain+'。已装备与已锁定的不会被分解。</p><div class="btnrow"><button class="btn red" onclick="confirmBatch('+gain+')">确认分解</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function confirmBatch(gain){
 S.equips=S.equips.filter(e=>e.hero||e.locked||(e.qual!=='普通'&&e.qual!=='优秀'));
 S.res.stone+=gain;sfx.coin();save();closeModal();renderTop();render();toast('分解完成，获得强化石×'+gain);
}

let questTab='新手';
function vQuests(){
 const cats=['新手','每日','成长','章节'];
 const dailyPts=QUESTS.filter(q=>q.daily&&S.daily.claimed[q.id]).reduce((a,q)=>a+(q.act||0),0);
 const chests=ACTIVITY_CHESTS.map((c,i)=>{const got=!!S.daily.chests[i];return '<span style="display:inline-block;margin-right:6px">'+(got?'已领取':dailyPts>=c.pts?'<button class="btn sm" onclick="claimChest('+i+')">'+c.pts+'分领取</button>':'<span class="mut">'+c.pts+'分</span>')+'</span>';}).join('');
 const rows=QUESTS.filter(q=>q.cat===questTab).map(q=>{const p=Math.min(questProgress(q),q.target),done=p>=q.target,got=isQuestClaimed(q);
  return '<div class="questrow"><div style="flex:1"><b>'+q.name+'</b><div class="mut">'+q.desc+'（'+p+'/'+q.target+'）· 奖励 '+rewText(q.rew)+(q.act?' · 活跃+'+q.act:'')+'</div><div class="progress" style="margin-top:4px"><i style="width:'+(p/q.target*100)+'%"></i></div></div>'
  +(got?'<span class="cost">已领取</span>':done?'<button class="btn sm green" onclick="claimQuest(\''+q.id+'\')">领取</button>':'<span class="mut">进行中</span>')+'</div>';}).join('');
 return '<div class="page"><h2 class="ptitle">'+ICONS.book+' 任务</h2>'
 +'<div class="panel"><b>今日活跃度：'+dailyPts+' / 100</b><div style="margin-top:6px">'+chests+'</div><div class="btnrow" style="margin-top:8px"><button class="btn sm" onclick="claimAllQuests()">一键领取可领取任务</button></div></div>'
 +'<div class="filters">'+cats.map(c=>'<button class="'+(questTab===c?'on':'')+'" onclick="questTab=\''+c+'\';render()">'+c+'</button>').join('')+'</div>'
 +'<div class="panel">'+(rows||'<div class="emptybox">暂无任务</div>')+'</div></div>';
}
function claimQuest(id){const q=QUESTS.find(x=>x.id===id);if(!q||isQuestClaimed(q)||questProgress(q)<q.target)return;
 addRes(q.rew);if(q.daily)S.daily.claimed[id]=true;else S.questClaimed[id]=true;passAddXp(15);sfx.coin();save();renderTop();render();toast('任务完成：'+rewText(q.rew));}
function claimAllQuests(){let n=0;QUESTS.forEach(q=>{if(!isQuestClaimed(q)&&questProgress(q)>=q.target){addRes(q.rew);if(q.daily)S.daily.claimed[q.id]=true;else S.questClaimed[q.id]=true;n++;}});if(n){passAddXp(15*n);sfx.coin();save();renderTop();render();toast('领取了 '+n+' 个任务奖励');}else toast('暂无可领取的任务');}
function claimChest(i){const c=ACTIVITY_CHESTS[i];const pts=QUESTS.filter(q=>q.daily&&S.daily.claimed[q.id]).reduce((a,q)=>a+(q.act||0),0);

 +'<div class="panel docsec" id="docsec4"'+dshow(4)+'><b>四、数值说明（对应 BALANCE_NOTES）</b><p class="mut">成长：生命 = 基础 ×[1+0.065×(等级-1)]×星级倍率，攻击系数 0.055，护甲/魔抗 0.045；星级倍率 1 / 1.08 / 1.18 / 1.30 / 1.45。伤害 = 攻击 × 技能倍率 × 100/(100+有效防御) × 暴击(5% 基础 / 150%) × 阵营倍率(克制 1.15) × 波动(0.95–1.05) × (1-减伤，上限 70%)。能量：初始 20，普攻命中 +12，受击每秒最多 +10，大招消耗 100。升级成本 L→L+1：金币 40+18L、经验 20+10L。招募：R 60% / SR 35% / SSR 5%，每 10 抽至少 SR、连续 49 抽无 SSR 第 50 抽必出。挂机：每分钟金币 15+2S、经验 6+2S（S = 最高通关全局序号），上限 8 小时。集火破蓄（配置 CAST_BREAK.pct = 6%）：可打断蓄力期间，Boss 被设为集火目标时，全队直接伤害累计达到其最大生命 6% 即打断（打断后仍进正常冷却），蓄力预警条下方有金色破蓄进度；眩晕打断保留；不可打断蓄力（如失眠观星者生命低于 35% 后的「熬夜流星」）不受破蓄影响。阈值标定依据：初始五人 Lv12 集火 1-10 第一蓄力窗伤害约占 Boss 最大生命 7.0%–8.5%、后续窗约 3%，任务书建议的 8% 经实测只是种子运气，故取 6%。这些是首轮标定参数，已用自动模拟验证可通关，未声称完成真人手感平衡。</p><p class="mut">模拟充值中心（本轮新增，免费模拟、非真实支付）：模拟币与钻石 1 : 10；钻石档位 6 / 30 / 68 / 128 / 328 / 648 模拟币（对应 60 / 300 / 680 / 1280 / 3280 / 6480 钻石），逐档首充双倍（状态逐档存档记录）；模拟钱包初始 2000、每日免费补领 500，全部消费计入累计并写入流水；累充返利 6 档（累计 30 / 68 / 128 / 328 / 648 / 1288 模拟币）；月卡 30 模拟币 / 30 天 / 每日 100 钻，年卡 328 模拟币 / 365 天 / 每日 150 钻（按游戏日领取、过期续购叠加）；成长基金 68 模拟币，按通关主线关数 1 / 5 / 10 / 15 / 20 / 30 / 40 分 7 档领取；远征战令 20 级、每级 100 经验（战斗胜 +30 / 负 +15、领任务奖励 +15/个、活跃宝箱 +10、完成一次迷雾远征 +40），高级轨 128 模拟币、购买后可补领已达等级；限时礼包 3 个（限购 3 / 2 / 1 次，售罄置灰）。所有购买为扣额度与发奖励的原子操作并防连点，状态随存档持久化。</p><p class="mut">外观与赛季活动「星尘季」（本轮新增）：外观解锁价按稀有度 R 200 / SR 300 / SSR 500 钻石，或外观解锁券 ×1；外观只改形象不改属性。活动关卡共 5 关（敌方等级 8 / 16 / 26 / 36 / 46，第 5 关为失眠观星者 Boss 战），首通奖励含星尘 20 / 26 / 34 / 42 / 60 与一次性道具，重复胜利只掉星尘 12 / 16 / 20 / 26 / 34；后续关卡需通关上一关解锁。星尘商店 7 件：招募券 60（限 5）、技能书 ×3 45（限 5）、金币 ×2000 40（限 10）、经验 ×1500 40（限 10）、外观解锁券 150（限 3）、指定外观苔盾「秋叶守卫」200（限 1）、指定外观灯羽「彗星占星师」300（限 1）；兑换先校验余额与限购再原子扣减入账，余额不为负。</p></div>'
