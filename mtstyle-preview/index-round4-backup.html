/* 立绘：全部取自咕噜交接包原画（hero/enemy/boss WebP），头像为原画裁切，非任何外部 IP 形象 */
function iconSvg(kind,key,size){
  let src;
  if(kind==='hero') src=ART['hero-'+key];
  else if(kind==='boss'||(kind==='foe'&&/^B\d/i.test(key))) src=ART['boss-'+String(key).toLowerCase()];
  else src=ART['foe-'+String(key).toLowerCase()];
  return '<img class="pimg" style="width:'+size+'px;height:'+size+'px" src="'+src+'" alt="">';
}
function battleIcon(u){if(u.side===0||u.hid)return iconSvg('hero',u.hid||u.eid,38);if(u.eid==='BOSS')return iconSvg('boss','B'+(u.bossKey||'1'),38);return iconSvg('foe',u.eid,38);}
function figIcon(u){if(u.side===0||u.hid)return iconSvg('hero',u.hid||u.eid,64);if(u.eid==='BOSS')return iconSvg('boss','B'+(u.bossKey||'1'),76);return iconSvg('foe',u.eid,64);}
function avatar(id,foe,bossKey){
  if(foe){const key=bossKey?'B'+bossKey:(ENEMIES[id]?id:'B1');return '<div class="avatar foe">'+iconSvg(bossKey?'boss':'foe',key,52)+'</div>';}
  return '<div class="avatar rar-'+(HEROES[id]?HEROES[id].rar:'R')+'">'+iconSvg('hero',id,52)+'</div>';
}
function bannerHtml(){
  return '<div class="banner"><img src="'+ART.city+'" alt=""><div class="shade"></div><div class="btitle"><b>冒险公会 · 主城</b><div class="bsub">战力约 '+fmt(teamPower())+' · 编队 '+S.formation.length+'/5</div></div><div class="bteam">'+S.formation.map(function(id){return iconSvg('hero',id,38);}).join('')+'</div></div>';
}
function stars(n){return '<span class="stars">'+'★'.repeat(n)+'<span style="color:#c9b384">'+'★'.repeat(5-n)+'</span></span>';}
function go(v){S.view=v;save();render();}
function renderTop(){const p=idlePending();document.getElementById('topbar').innerHTML='<b>咕噜远征团</b><span class="res">💰 '+fmt(S.res.gold)+'</span><span class="res">✨ '+fmt(S.res.exp)+'</span><span class="res">💎 '+fmt(S.res.dia)+'</span><span class="res">🎟️ '+fmt(S.res.ticket)+'</span><span class="res">📕 '+fmt(S.res.book)+'</span><span class="res">🏛️ '+fmt(S.res.gcoin)+'</span><button onclick="claimIdle()">挂机收益 '+p.gold+'/'+p.exp+'</button>';}

function render(){if(S.daily.date!==todayStr()){S.daily={date:todayStr(),counters:{battles:0,summons:0,upgrades:0,idle:0},claimed:{}};}renderTop();renderNav();const v=S.view;const fn={home:vHome,map:vMap,summon:vSummon,heroes:vHeroes,tower:vTower,arena:vArena,dungeon:vDungeon,guild:vGuild,codex:vCodex,settings:vSettings}[v]||vHome;document.getElementById('view').innerHTML=fn();window.scrollTo(0,0);}
function vHome(){const p=idlePending();const b=calcBonds(S.formation);const next=highestStage()+1;return '<div class="page">'+bannerHtml()

+'<div class="panel"><b>挂机收益</b><div class="mut">按最高通关进度计费，上限 480 分钟；每累计 60 分钟多一件装备。</div><div class="kv"><span>待领取</span><b>金币 '+p.gold+' · 经验 '+p.exp+'（'+Math.floor(p.mins)+' 分钟）</b></div><div class="btnrow"><button class="btn green" onclick="claimIdle()">领取</button></div></div>'
+'<div class="panel"><b>当前编队</b>（战力约 '+fmt(teamPower())+'）<div class="teamrow">'+S.formation.map(id=>iconSvg('hero',id,46)).join('')+'</div><div class="mut">'+S.formation.map(id=>HEROES[id].name).join(' · ')+'</div><div class="mut">'+(b.bonds.length?b.bonds.join('；'):'暂无羁绊：同阵营 2 人起生效')+'</div><div class="mut">克制链：森芽 → 潮汐 → 熔炉 → 星灯 → 森芽（克制 +15% 伤害）</div><div class="btnrow"><button class="btn" onclick="go(\'heroes\')">调整编队</button><button class="btn blue" onclick="go(\'map\')">继续推图 '+(next<40?('第 '+(Math.floor(next/10)+1)+'-'+(next%10+1)+' 关'):'已通关全部 40 关')+'</button></div></div>'

+'<div class="panel"><b>每日任务</b>'+dailyQuestsHtml()+'</div>'
+'<div class="panel"><b>七日签到</b>'+signinHtml()+'</div></div>';}
function dailyQuestsHtml(){if(S.daily.date!==todayStr()){S.daily={date:todayStr(),counters:{battles:0,summons:0,upgrades:0,idle:0},claimed:{}};}const q=[['battles','赢下 1 场战斗',1,{gold:300,dia:20}],['summons','招募 1 次',1,{ticket:1}],['upgrades','升级 1 次英雄',1,{exp:200,book:1}],['idle','领取 1 次挂机收益',1,{gold:200}]];return q.map(x=>{const c=S.daily.counters[x[0]]||0,done=c>=x[2],cl=S.daily.claimed[x[0]];return '<div class="kv"><span>'+x[1]+'（'+c+'/'+x[2]+'）</span>'+(cl?'<span class="mut">已领取</span>':done?'<button class="btn sm green" onclick="claimQuest(\''+x[0]+'\','+JSON.stringify(x[3]).replace(/"/g,'&quot;')+')">领取</button>':'<span class="mut">未完成</span>')+'</div>';}).join('');}
function claimQuest(id,rew){if(S.daily.claimed[id])return;S.daily.claimed[id]=true;addRes(rew);save();render();toast('任务奖励已领取');}
function signinHtml(){const rewards=[{gold:300},{dia:30},{ticket:1},{book:2},{exp:500},{stone:2},{ticket:2,dia:50}];const day=S.signin.days%7;const can=S.signin.last!==todayStr();let h='';rewards.forEach((r,i)=>{h+='<span class="tag" style="'+(i===day&&can?'background:#f2b63c':'')+'">第'+(i+1)+'天'+(i<day||(i===day&&!can)?' ✓':'')+'</span>';});return '<div>'+h+'</div><div class="btnrow"><button class="btn sm" '+(can?'':'disabled')+' onclick="doSignin()">签到领取第 '+(day+1)+' 天</button></div><div class="mut">奖励：第 '+(day+1)+' 天 '+JSON.stringify(rewards[day])+'</div>';}
function doSignin(){if(S.signin.last===todayStr())return;const rewards=[{gold:300},{dia:30},{ticket:1},{book:2},{exp:500},{stone:2},{ticket:2,dia:50}];addRes(rewards[S.signin.days%7]);S.signin.days++;S.signin.last=todayStr();save();render();toast('签到成功');}
function stageEnemies(g){const ch=Math.floor(g/10),lv=REC_LV[g],raw=[];STAGE_DEF[g].forEach(row=>{const eid=row[0],n=row[1],mod=row[2]||'';for(let i=0;i<n;i++){if(eid==='BOSS')raw.push({eid:'BOSS',lv,mod:'',row:0,bossKey:''+(ch+1)});else raw.push({eid,lv,mod,row:ENEMIES[eid].row});}});raw.sort((a,b)=>a.row-b.row);return raw.slice(0,5);}
function stageReward(g){const boss=g%10===9,elite=g%10===4;return {gold:120+g*55+(boss?600:elite?220:0),exp:60+g*30+(boss?300:elite?110:0),book:boss?3:(g%3===2?1:0),dia:boss?60:0,ticket:boss?1:0};}
function vMap(){let h='<h2>推图 · 主线战役</h2><div class="page"><div class="mut">4 章 × 10 关，复用咕噜原有关卡编排与推荐等级。三星通关后可扫荡。</div>';for(let ch=0;ch<4;ch++){h+='<div class="panel"><b>第 '+(ch+1)+' 章 · '+CHAPTERS[ch].name+'</b>';for(let i=0;i<10;i++){const g=ch*10+i,unlocked=g<=highestStage()+1,st=S.stages[g]||0;const rw=stageReward(g);h+='<div class="kv stage"><span>'+(ch+1)+'-'+(i+1)+' '+STAGE_NAMES[g]+' <span class="mut">推荐 Lv.'+REC_LV[g]+(st?' · '+stars(st):'')+'</span></span><span>'+(unlocked?'<button class="btn sm" onclick="startStage('+g+')">挑战</button>'+(st>=3?'<button class="btn sm ghost" onclick="sweepStage('+g+')">扫荡</button>':''):'<span class="mut">🔒</span>')+'</span></div><div class="stage-foes">'+stageEnemies(g).map(function(e){return iconSvg(e.eid==='BOSS'?'boss':'foe',e.eid==='BOSS'?('B'+e.bossKey):e.eid,30);}).join('')+'</div><div class="mut">奖励：金币 '+rw.gold+' · 经验 '+rw.exp+(rw.book?' · 技能书 '+rw.book:'')+(rw.dia?' · 钻石 '+rw.dia:'')+(rw.ticket?' · 招募券 '+rw.ticket:'')+'</div>';}h+='</div>';}return h+'</div>';}
function sweepStage(g){const st=S.stages[g]||0;if(st<3){toast('需三星通关后才能扫荡');return;}const rw=stageReward(g);addRes(rw);S.daily.counters.battles++;save();render();toast('扫荡成功：金币 +'+rw.gold+'，经验 +'+rw.exp);}
function rollOne(){const P=S.pity;let rar;if(P.sinceSSR>=49)rar='SSR';else{const r=Math.random();rar=r<0.05?'SSR':r<0.40?'SR':'R';}if(P.group>=9&&!P.groupSR&&rar==='R')rar='SR';if(rar==='SSR')P.sinceSSR=0;else P.sinceSSR++;if(rar!=='R')P.groupSR=true;P.group++;if(P.group>=10){P.group=0;P.groupSR=false;}const pool=HERO_IDS.filter(id=>HEROES[id].rar===rar);return pool[Math.floor(Math.random()*pool.length)];}
function doSummon(n,pay){const costT=n===10?10:1,costD=n===10?2700:300;if(pay==='ticket'&&S.res.ticket<costT){toast('招募券不足');return;}if(pay==='dia'&&S.res.dia<costD){toast('钻石不足');return;}if(pay==='ticket')S.res.ticket-=costT;else S.res.dia-=costD;const res=[];for(let i=0;i<n;i++){const id=rollOne();if(!S.heroes[id]){S.heroes[id]={lv:1,star:1,awaken:0,sk:{active:1,ult:1,passive:1},spent:{gold:0,exp:0,book:0}};res.push({id,isNew:true});}else{S.frags[id]=(S.frags[id]||0)+FRAG_BY_RAR[HEROES[id].rar];res.push({id,isNew:false});}}S.daily.counters.summons+=n;save();render();const el=document.getElementById('sumres');if(el)el.innerHTML=res.map(r=>'<div class="card rar-'+HEROES[r.id].rar+'">'+iconSvg('hero',r.id,64)+'<b>'+HEROES[r.id].name+'</b><div>'+HEROES[r.id].rar+' · '+HEROES[r.id].fac+'</div><div class="mut">'+(r.isNew?'新伙伴！':'重复 → 碎片 +'+FRAG_BY_RAR[HEROES[r.id].rar])+'</div></div>').join('');}
function vSummon(){return '<h2>召唤 · 招募伙伴</h2><div class="page"><div class="notice">概率：R 60% · SR 35% · SSR 5%；SSR 最迟第 50 次出现；每组 10 次前 9 次无 SR+ 则第 10 次必得 SR+。单抽与十连共用计数。重复英雄转为碎片。当前距保底 SSR 还差 '+(50-S.pity.sinceSSR)+' 次。</div><div class="panel"><div class="kv"><span>持有</span><b>招募券 '+S.res.ticket+' · 钻石 '+S.res.dia+'</b></div><div class="btnrow"><button class="btn" onclick="doSummon(1,\'ticket\')">单抽（券×1）</button><button class="btn green" onclick="doSummon(10,\'ticket\')">十连（券×10）</button><button class="btn blue" onclick="doSummon(1,\'dia\')">单抽（钻石 300）</button><button class="btn blue" onclick="doSummon(10,\'dia\')">十连（钻石 2700）</button></div></div><div class="grid" id="sumres"></div><div class="panel"><b>图鉴一览</b><div>'+HERO_IDS.map(id=>'<span class="oppchip">'+iconSvg('hero',id,26)+HEROES[id].name+'（'+HEROES[id].rar+'）'+(S.heroes[id]?' ✓':' · 未获得')+'</span>').join('')+'</div></div></div>';}
function vHeroes(){const id=S.selHero;const owned=HERO_IDS.filter(x=>S.heroes[x]);let h='<h2>英雄 · 养成与编队</h2><div class="page">';
h+='<div class="panel"><b>编队（前 2 槽为前排）</b>'+S.formation.map((fid,i)=>'<div class="formrow">'+iconSvg('hero',fid,34)+'<span class="tag">'+(i+1)+'</span><span class="tag">'+(i<2?'前排':'后排')+'</span><span class="fname"><b>'+HEROES[fid].name+'</b> <span class="mut">'+HEROES[fid].role+'</span></span><button class="btn sm" onclick="moveForm('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="btn sm" onclick="moveForm('+i+',1)" '+(i===S.formation.length-1?'disabled':'')+'>↓</button><button class="btn sm red" onclick="removeForm('+i+')">✕</button></div>').join('')+'<div class="mut">点击下方英雄加入编队（最多 5 人）。共鸣：只看等级前 5 名，未进前 5 的英雄战斗等级共享前 5 名最低等级。</div></div>';
h+='<div class="grid">'+HERO_IDS.map(x=>{const H=HEROES[x],own=!!S.heroes[x];return '<div class="card rar-'+H.rar+' '+(own?'':'locked ')+(S.formation.includes(x)?'sel':'')+'" onclick="selectHero(\''+x+'\')">'+avatar(x)+'<b>'+H.name+'</b><div class="mut">'+H.rar+' · '+H.fac+' · '+H.role+'</div><div>'+(own?stars(S.heroes[x].star)+' Lv.'+S.heroes[x].lv+'（战'+effLv(x)+'）':'<span class="mut">未获得</span>')+'</div>'+(S.formation.includes(x)?'<div class="mut">已上阵</div>':'')+'</div>';}).join('')+'</div>';
if(S.heroes[id]){const H=HEROES[id],hh=S.heroes[id],st=heroStats(id),uc=upCost(hh.lv);const eqs=S.equips.filter(e=>e.hero===id);
 h+='<div class="panel"><b>'+H.name+'</b> <span class="mut">'+H.rar+' · '+H.fac+' · '+H.role+' · '+H.pos+' · '+H.intro+'</span><div class="kv"><span>等级（有效 Lv.'+st.lv+'）</span><b>Lv.'+hh.lv+' · 星级 '+stars(hh.star)+' · 觉醒 +'+hh.awaken+'</b></div><div class="kv"><span>生命 / 攻击</span><b>'+fmt(st.hp)+' / '+fmt(st.atk)+'</b></div><div class="kv"><span>护甲 / 魔抗 / 速度</span><b>'+st.armor+' / '+st.mres+' / '+st.spd+'</b></div><div class="kv"><span>技能</span><b>普攻 '+H.basic+' · 主动 '+H.active+'（冷却 '+H.acd+'s）· 大招 '+H.ult+'（仅本原型）</b></div><div class="kv"><span>技能等级</span><b>主动 Lv.'+hh.sk.active+' · 大招 Lv.'+hh.sk.ult+' · 被动 Lv.'+hh.sk.passive+'</b></div>'
 +'<div class="btnrow"><button class="btn sm" onclick="levelUp(\''+id+'\',1)">升级（金币 '+uc.gold+' · 经验 '+uc.exp+'）</button><button class="btn sm" onclick="levelUp(\''+id+'\',5)">连升 5 级</button><button class="btn sm" onclick="skillUp(\''+id+'\')">技能升级（技能书 2）</button></div>'
 +'<div class="btnrow"><button class="btn sm green" '+(hh.star>=5?'disabled':'')+' onclick="starUp(\''+id+'\')">升星（碎片 '+(S.frags[id]||0)+'/'+STAR_FRAG[hh.star]+' · 金币 '+STAR_GOLD[hh.star]+'）</button><button class="btn sm" '+(hh.awaken>=3||hh.lv<15?'disabled':'')+' onclick="awaken(\''+id+'\')">觉醒（进阶石 3 · 金币 2000，属性 +5%）</button><button class="btn sm red" onclick="resetHero(\''+id+'\')">100% 无损重置</button></div>'
 +'<div class="kv"><span>已投入（重置返还）</span><b>金币 '+fmt(hh.spent.gold)+' · 经验 '+fmt(hh.spent.exp)+' · 技能书 '+hh.spent.book+'</b></div></div>';
 h+='<div class="panel"><b>装备（4 槽）</b>'+['weapon','armor','trinket','boots'].map(sl=>{const cur=eqs.find(e=>e.slot===sl);const inv=S.equips.filter(e=>e.slot===sl&&!e.hero);return '<div class="kv"><span>'+SLOTS[sl]+'</span><span>'+(cur?cur.name+' · '+cur.qual+' · 强化 +'+(cur.enh||0)+' <button class="btn sm" onclick="enhEquip(\''+cur.id+'\')">强化（金币 '+(100*((cur.enh||0)+1))+'）</button> <button class="btn sm red" onclick="unequip(\''+cur.id+'\')">卸下</button>':'未穿戴')+'</span></div>'+(inv.length?'<div class="mut">背包：'+inv.map(e=>'<button class="btn sm ghost" onclick="equipTo(\''+e.id+'\',\''+id+'\')">'+e.name+' · '+e.qual+'</button>').join(' ')+'</div>':'');}).join('')+'</div>';}
h+='<div class="panel"><b>背包装备（未穿戴 '+S.equips.filter(e=>!e.hero).length+' 件）</b><div class="mut">来源：挂机收益、战斗掉落。点击英雄卡片查看详情后穿戴。</div></div>';
return h+'</div>';}
function selectHero(x){S.selHero=x;if(S.heroes[x]&&!S.formation.includes(x)&&S.formation.length<5){S.formation.push(x);}save();render();}
function moveForm(i,d){const j=i+d;if(j<0||j>=S.formation.length)return;const t=S.formation[i];S.formation[i]=S.formation[j];S.formation[j]=t;save();render();}
function removeForm(i){if(S.formation.length<=1){toast('编队至少保留 1 人');return;}S.formation.splice(i,1);save();render();}
function levelUp(id,times){const h=S.heroes[id];if(!h)return;let done=0;for(let i=0;i<times;i++){const c=upCost(h.lv);if(S.res.gold<c.gold||S.res.exp<c.exp)break;S.res.gold-=c.gold;S.res.exp-=c.exp;h.spent.gold+=c.gold;h.spent.exp+=c.exp;h.lv++;done++;}if(!done){toast('金币或经验不足');return;}S.daily.counters.upgrades+=done;save();render();}
function skillUp(id){const h=S.heroes[id];if(S.res.book<2){toast('技能书不足');return;}S.res.book-=2;h.spent.book+=2;h.sk.active=Math.min(5,h.sk.active+1);h.sk.ult=Math.min(5,h.sk.ult+1);save();render();}
function starUp(id){const h=S.heroes[id];if(h.star>=5)return;if((S.frags[id]||0)<STAR_FRAG[h.star]||S.res.gold<STAR_GOLD[h.star]){toast('碎片或金币不足');return;}S.frags[id]-=STAR_FRAG[h.star];S.res.gold-=STAR_GOLD[h.star];h.star++;save();render();toast(HEROES[id].name+' 升至 '+h.star+' 星！');}
function awaken(id){const h=S.heroes[id];if(S.res.stone<3||S.res.gold<2000){toast('进阶石或金币不足');return;}S.res.stone-=3;S.res.gold-=2000;h.awaken++;save();render();}
function resetHero(id){const h=S.heroes[id];S.res.gold+=h.spent.gold;S.res.exp+=h.spent.exp;S.res.book+=h.spent.book;h.lv=1;h.star=1;h.awaken=0;h.sk={active:1,ult:1,passive:1};h.spent={gold:0,exp:0,book:0};S.equips.forEach(e=>{if(e.hero===id)e.hero=null;});save();render();toast('已 100% 返还养成资源');}
function equipTo(eid,hid){const e=S.equips.find(x=>x.id===eid);if(!e)return;S.equips.forEach(x=>{if(x.hero===hid&&x.slot===e.slot)x.hero=null;});e.hero=hid;save();render();}
function unequip(eid){const e=S.equips.find(x=>x.id===eid);if(e)e.hero=null;save();render();}
function enhEquip(eid){const e=S.equips.find(x=>x.id===eid);const cost=100*((e.enh||0)+1);if((e.enh||0)>=10){toast('已满强化');return;}if(S.res.gold<cost){toast('金币不足');return;}S.res.gold-=cost;e.enh=(e.enh||0)+1;save();render();}
</script>
<script>
'use strict';
/* ===== 其余玩法视图 ===== */
function vTower(){const f=S.tower+1,lv=4+f;const rw={gold:200+f*40,exp:120+f*25,dia:f%5===0?30:0};const band=Math.floor((f-1)/10)*10+1;let ladder='';for(let k=0;k<10;k++){const fl=band+k;const st=fl<=S.tower?'已通关 ✓':fl===f?'当前 ▶':'待挑战';ladder+='<div class="kv"><span>第 '+fl+' 层'+(fl%10===0?' · Boss':'')+'</span><b>'+st+'</b></div>';}return '<h2>爬塔 · 守护者之塔</h2><div class="page"><div class="notice">层数越高敌人越强，每 10 层有 Boss。当前已通关 '+S.tower+' 层。</div><div class="panel"><div class="kv"><span>第 '+f+' 层</span><b>敌人等级 Lv.'+lv+'</b></div><div class="mut">奖励：金币 '+rw.gold+' · 经验 '+rw.exp+(rw.dia?' · 钻石 '+rw.dia:'')+'</div><div class="btnrow"><button class="btn green" onclick="startTower()">挑战第 '+f+' 层</button></div></div><div class="panel"><b>本段进度（第 '+band+'–'+(band+9)+' 层）</b>'+ladder+'<div class="mut">爬塔阵容复用当前编队；失败不扣层数，可反复尝试。</div></div></div>';}
function towerSpecs(f){const lv=4+f,sets=[['E01','E02','E03'],['E02','E03','E04'],['E05','E06','E02'],['E08','E07','E03'],['E09','E10','E05'],['E06','E07','E04']];const set=sets[Math.floor((f-1)/5)%sets.length];const n=f%10===0?4:3+(f>14?1:0);const raw=[];for(let i=0;i<n;i++){const eid=f%10===0&&i===0?'BOSS':set[i%set.length];raw.push({eid,lv,mod:(f%5===0&&i===0&&eid!=='BOSS')?'elite':'',row:eid==='BOSS'?0:ENEMIES[eid].row,bossKey:''+((Math.floor((f-1)/10)%4)+1)});}raw.sort((a,b)=>a.row-b.row);return raw;}
function arenaOpponent(tier){let seed=0;const s=todayStr()+':'+tier;for(let i=0;i<s.length;i++)seed=(seed*31+s.charCodeAt(i))>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};const avgLv=Math.max(1,Math.round(S.formation.reduce((a,id)=>a+effLv(id),0)/Math.max(1,S.formation.length)));const lv=avgLv+tier*2;const tanks=HERO_IDS.filter(id=>HEROES[id].role==='坦克'),heals=HERO_IDS.filter(id=>HEROES[id].role==='治疗');const pick=a=>a[Math.floor(rnd()*a.length)];const ids=[pick(tanks),pick(heals)];while(ids.length<5){const c=pick(HERO_IDS);if(!ids.includes(c))ids.push(c);}return ids.map((id,i)=>({hid:id,lv,star:1+Math.floor(rnd()*3),pos:i}));}
function vArena(){if(S.arena.day!==todayStr()){S.arena.day=todayStr();S.arena.left=5;}const tiers=[{name:'青铜',need:0},{name:'白银',need:100},{name:'黄金',need:300}];return '<h2>竞技场 · 模拟对战</h2><div class="page"><div class="notice">对手为按日期种子生成的模拟阵容（咕噜英雄池），不是真实玩家，没有排行榜造假。每日 5 次挑战机会，今日剩余 '+S.arena.left+' 次。积分：'+S.arena.score+'（胜 '+S.arena.wins+' · 负 '+S.arena.losses+'）。</div>'+tiers.map((t,ti)=>{const opp=arenaOpponent(ti);const pw=opp.reduce((a,o)=>{const H=HEROES[o.hid];return a+Math.round(H.base[0]*(1+0.065*(o.lv-1))*STAR_MULT[o.star]/10+H.base[1]*(1+0.055*(o.lv-1))*STAR_MULT[o.star]*4);},0);return '<div class="panel"><div class="kv"><span>'+t.name+' 段位</span><b>模拟战力约 '+fmt(pw)+'</b></div><div>'+opp.map(o=>'<span class="oppchip">'+iconSvg('hero',o.hid,24)+HEROES[o.hid].name+' Lv.'+o.lv+' '+stars(o.star)+'</span>').join('')+'</div><div class="btnrow"><button class="btn" '+(S.arena.left<=0?'disabled':'')+' onclick="startArena('+ti+')">挑战（积分 +30 / 胜）</button></div></div>';}).join('')+'<div class="panel"><b>积分商店</b><div class="btnrow"><button class="btn sm" onclick="arenaShop(100,1)">100 积分 → 招募券 ×1</button><button class="btn sm" onclick="arenaShop(60,0)">60 积分 → 随机碎片 ×10</button></div></div></div>';}
function arenaShop(cost,kind){if(S.arena.score<cost){toast('积分不足');return;}S.arena.score-=cost;if(kind===1)S.res.ticket+=1;else{const id=HERO_IDS[Math.floor(Math.random()*HERO_IDS.length)];S.frags[id]=(S.frags[id]||0)+10;}save();render();}

function vGuild(){if(S.guild.day!==todayStr()){S.guild.day=todayStr();S.guild.bossDmg=0;}const boss=BOSSES['B'+((Math.floor(Date.now()/86400000)%4)+1)];const sim=[['晨星小队',8200],['炉心小队',6500],['潮汐小队',5400],['星灯小队',4100]];return '<h2>公会 · 咕噜冒险公会（单机模拟）</h2><div class="page"><div class="notice">本公会为单机模拟：没有真实玩家、没有在线人数、没有真实聊天。成员与排名均为本地固定模拟数据，仅用于演示公会 Boss / 商店 / 试炼的玩法循环。</div><div class="panel"><div style="display:flex;gap:8px;align-items:center">'+iconSvg('boss','B'+((Math.floor(Date.now()/86400000)%4)+1),56)+'<b>公会 Boss · '+boss.name+'</b></div><div class="mut">今日你已造成伤害：'+fmt(S.guild.bossDmg)+'（每次挑战限时 30 秒，按伤害发公会币：伤害 ÷ 100）</div><div class="btnrow"><button class="btn red" onclick="startGuildBoss()">挑战公会 Boss</button></div><div class="mut">模拟排名</div><div>'+sim.map(x=>'<span class="tag">'+x[0]+' '+fmt(x[1])+'</span>').join('')+'<span class="tag">你 '+fmt(S.guild.bossDmg)+'</span></div></div><div class="panel"><b>公会商店（公会币 '+fmt(S.res.gcoin)+'）</b><div class="btnrow"><button class="btn sm" onclick="guildShop(80,1)">80 币 → 招募券 ×1</button><button class="btn sm" onclick="guildShop(50,0)">50 币 → 随机碎片 ×10</button><button class="btn sm" onclick="guildShop(120,2)">120 币 → 进阶石 ×2</button></div></div><div class="panel"><b>公会试炼</b><div class="mut">多人协作推进的单机化版本：每日 2 次，今日已用 '+((S.guild.trialDay===todayStr())?S.guild.trial:0)+'/2 次，胜得公会币 60 + 金币 500。</div><div class="btnrow"><button class="btn" onclick="startGuildTrial()">参加试炼</button></div></div></div>';}

function dmgCalc(att,tgt,mult,mag){const def=mag?tgt.mres:tgt.armor;let d=att.atk*mult*100/(100+def);if(COUNTER[att.fac]===tgt.fac)d*=1.15;if(tgt.markUntil>BT.t)d*=1.1;if(att.atkBuffUntil>BT.t)d*=1.12;if(att.atkDownUntil>BT.t)d*=0.85;let crit=false;if(Math.random()<0.10){d*=1.5;crit=true;}return {d:Math.max(1,Math.round(d)),crit};}
function applyDamage(att,tgt,mult,mag,opts){opts=opts||{};if(!tgt.alive)return 0;if(att&&typeof BT!=='undefined'&&BT)BT.lastAct={u:att,t:BT.t};let raw=dmgCalc(att,tgt,mult,mag).d;if(tgt.dmgRedUntil>BT.t)raw=Math.round(raw*0.8);let dealt=raw;if(tgt.shield>0){const absorbed=Math.min(tgt.shield,dealt);tgt.shield-=absorbed;dealt-=absorbed;if(absorbed>0)log(tgt.name+' 的护盾挡住了 '+absorbed+' 点伤害');}
 if(tgt.shareUntil>BT.t&&tgt.shareBy&&tgt.shareBy.alive&&tgt.shareBy!==tgt){const shared=Math.round(dealt*tgt.sharePct);dealt-=shared;hurt(tgt.shareBy,shared,att);}hurt(tgt,dealt,att);
 if(att&&att.side===0&&att.hid==='qiren'&&!tgt.alive&&!att.passiveUsed){att.energy=Math.min(100,att.energy+15);att.passiveUsed=true;setTimeout(()=>{if(att)att.passiveUsed=false;},3000);}
 if(opts.burn){tgt.burn=Math.min(3,(tgt.burn||0)+1);tgt.burnUntil=BT.t+4000;if(att&&att.hid==='baoli')att.energy=Math.min(100,att.energy+2);}
 return raw;}
function hurt(tgt,amount,att){if(amount<=0)return;tgt.hp=Math.max(0,tgt.hp-amount);if(typeof BT!=='undefined'&&BT)BT.lastHit={u:tgt,t:BT.t};if(att)att.energy=Math.min(100,(att.energy||0)+4);tgt.energy=Math.min(100,(tgt.energy||0)+3);if(tgt.hp<=0&&tgt.alive){tgt.alive=false;log(tgt.name+' 倒下了');}}
function heal(u,tgt,amount){if(!tgt.alive)return;tgt.hp=Math.min(tgt.maxHp,tgt.hp+Math.round(amount));}
function addShield(u,amount,ms){u.shield=Math.max(u.shield,Math.round(amount));u.shieldUntil=BT.t+ms;}
function pickTarget(att){const foes=BT.units.filter(u=>u.side!==att.side&&u.alive);if(!foes.length)return null;const taunted=foes.filter(f=>f.tauntUntil>BT.t&&f.tauntBy&&f.tauntBy.alive);if(taunted.length)return taunted[0];if(att.hid==='qiren'||att.hid==='yefeng'){const back=foes.filter(f=>f.pos>=2);const pool=back.length?back:foes;return pool.reduce((a,b)=>a.hp<b.hp?a:b);}return foes.slice().sort((a,b)=>a.pos-b.pos)[0];}
function lowestAlly(side){const a=BT.units.filter(u=>u.side===side&&u.alive);if(!a.length)return null;return a.reduce((x,y)=>(x.hp/x.maxHp<y.hp/y.maxHp)?x:y);}
function doActive(u){if(typeof BT!=='undefined'&&BT)BT.lastSkill={name:u.name,skill:u.active,t:BT.t};const allies=BT.units.filter(x=>x.side===u.side&&x.alive),foes=BT.units.filter(x=>x.side!==u.side&&x.alive);const t=pickTarget(u);const sk=u.skLv?1+0.05*((u.skLv.active||1)-1):1;
 switch(u.hid){
  case 'taidun':foes.forEach(f=>{f.tauntUntil=BT.t+2000;f.tauntBy=u;});addShield(u,u.maxHp*0.12,5000);log(u.name+' 使用【看这里】：嘲讽 2 秒，护盾 +'+Math.round(u.maxHp*0.12));break;
  case 'heling':{const tg=lowestAlly(u.side);if(tg&&tg.hp/tg.maxHp<=0.9){heal(u,tg,u.atk*1.8*sk);log(u.name+' 治疗 '+tg.name+' +'+Math.round(u.atk*1.8*sk));}break;}

  case 'maoya':u.dmgRedUntil=BT.t+4000;log(u.name+' 架起铆钉架势，减伤 4 秒');break;
  case 'baoli':if(t){foes.filter(f=>f.pos===t.pos||Math.floor(f.pos/2)===Math.floor(t.pos/2)).forEach(f=>{const d=applyDamage(u,f,1.3*sk,true,{burn:true});log(u.name+' 试验品命中 '+f.name+' '+d+'（灼烧）');});}break;
  case 'tongshao':allies.slice().sort((a,b)=>b.atk-a.atk).slice(0,2).forEach(a=>a.atkBuffUntil=BT.t+5000);log(u.name+' 吹响开工哨声，攻击最高两人增攻 5 秒');break;
  case 'paopaoli':if(t){const d=applyDamage(u,t,1.5*sk,true);t.slowUntil=BT.t+4000;log(u.name+' 冰凉一下命中 '+t.name+' '+d+'（减速）');}break;
  case 'qiren':if(t){const d=applyDamage(u,t,1.9*sk,false);log(u.name+' 借浪突进命中 '+t.name+' '+d);}break;
  case 'shange':allies.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp).slice(0,2).forEach(a=>{heal(u,a,u.atk*1.2*sk);log(u.name+' 治疗 '+a.name);});break;
  case 'dengyu':allies.filter(a=>a!==u).sort((a,b)=>a.energy-b.energy).slice(0,2).forEach(a=>a.energy=Math.min(100,a.energy+12));log(u.name+' 预言：两名队友 +12 能量');break;
  case 'yefeng':if(t){const d=applyDamage(u,t,1.6*sk,false);t.markUntil=BT.t+5000;log(u.name+' 量好尺寸命中 '+t.name+' '+d+'（标记）');}break;

 }}
function doUlt(u){if(typeof BT!=='undefined'&&BT)BT.lastSkill={name:u.name,skill:u.ult,t:BT.t};const allies=BT.units.filter(x=>x.side===u.side&&x.alive),foes=BT.units.filter(x=>x.side!==u.side&&x.alive);const sk=u.skLv?1+0.05*((u.skLv.ult||1)-1):1;u.energy=0;

function enemyAct(u){const t=pickTarget(u);if(!t)return;const d=applyDamage(u,t,1,false);log(u.name+' 攻击 '+t.name+' '+d);
 if(u.kind==='healer'){const a=lowestAlly(1);if(a&&a.hp/a.maxHp<0.8){heal(u,a,u.atk*0.8);log(u.name+' 治疗 '+a.name);}}

function stepBattle(dt){BT.t+=dt;const units=BT.units;
 units.forEach(u=>{if(!u.alive)return;if(u.burn>0&&u.burnUntil>BT.t){const bd=Math.round(u.maxHp*0.02*u.burn);hurt(u,bd,null);if(!u.alive)return;}if(u.hotUntil>BT.t){heal(u,u,u.hotAtk*dt/1000);}if(u.shieldUntil&&u.shieldUntil<=BT.t)u.shield=0;});
 units.forEach(u=>{if(!u.alive||u.stunUntil>BT.t)return;if(u.side===0&&u.energy>=100){doUlt(u);return;}if(u.side===0&&u.cd<=0){const before=u.hp;doActive(u);u.cd=(u.acd||8000);}BT.t+=0;});
 units.forEach(u=>{if(!u.alive||u.stunUntil>BT.t)return;if(u.cd>0)u.cd-=dt;const spdMul=(u.slowUntil>BT.t?0.8:1)*(u.spdBoostUntil>BT.t?1.15:1);if(BT.t>=u.tNext){const interval=(u.int||2000)/spdMul;u.tNext=BT.t+interval;u.basicCount++;if(u.side===0){const t=pickTarget(u);if(t){let m=1;if(u.hid==='yexian'&&u.basicCount%4===0)m=1.4;const r=applyDamage(u,t,m,u.role==='法师'||u.role==='治疗');log(u.name+' 普攻 '+t.name+' '+r);if(u.hid==='taidun'&&!u.passiveUsed&&u.hp/u.maxHp<0.35){u.passiveUsed=true;heal(u,u,u.maxHp*0.10);log(u.name+' 被动【虽然害怕】：恢复 10% 生命（本场一次）');}if(u.hid==='heling'&&!u.passiveUsed){const a=BT.units.find(x=>x.side===0&&x.alive&&x.hp/x.maxHp<0.25);if(a){u.passiveUsed=true;heal(u,a,u.atk*1.2);log(u.name+' 被动治疗 '+a.name);}}}}else enemyAct(u);}});
 if(!BT.units.some(u=>u.side===0&&u.alive))return 'lose';if(!BT.units.some(u=>u.side===1&&u.alive))return 'win';if(BT.t>=BT.limit)return BT.mode==='guildboss'?'timeup':'lose';return null;}
function log(m){BT.logs.push('['+(BT.t/1000).toFixed(1)+'s] '+m);if(BT.logs.length>40)BT.logs.shift();}
let stageBT=null, stagePrevHp={}, stagePrevSh={}, stageLogN=0;
function statusTags(u){let t='';if(u.tauntUntil>BT.t)t+=' <span class="tag">嘲讽中</span>';if(u.burn>0&&u.burnUntil>BT.t)t+=' <span class="tag">灼烧×'+u.burn+'</span>';if(u.stunUntil>BT.t)t+=' <span class="tag">眩晕</span>';return t;}
function figHtml(u,i){
  const side=u.side===0?'ally':'foe';
  return '<div class="fig '+side+(u.eid==='BOSS'?' big':'')+(u.pos>=2?' back':'')+'" data-i="'+i+'"><div class="figimg">'+figIcon(u)+'</div><div class="figname">'+esc(u.name)+(u.side===0?' <span class="mut">Lv.'+u.lv+'</span>':'')+'</div><div class="figbars"><div class="bar hp"><i></i></div>'+(u.side===0?'<div class="bar en"><i></i></div>':'')+'<div class="figmeta"></div></div></div>';
}
function buildStage(){
  const el=document.getElementById('bbox');if(!el)return;
  const A=[],F=[];BT.units.forEach(function(u,i){(u.side===0?A:F).push(figHtml(u,i));});
  el.innerHTML='<h2 style="margin:4px 0">'+esc(BT.title)+'</h2><div class="skillbanner" id="skillbanner" style="display:none"></div><div class="mut" id="battlemeta"></div><div class="btnrow"><button class="btn sm" id="btnPause2" onclick="togglePause()">暂停</button><button class="btn sm" id="btnSpeed2" onclick="cycleBattleSpeed()">速度 1×</button><button class="btn sm" onclick="skipBattle()">跳过结算</button><button class="btn sm red" onclick="quitBattle()">撤退</button></div>'
  +'<div id="bstage"><img class="stagebg" src="'+ART.bg+'" alt=""><div class="figrow"><div class="figcol">'+A.join('')+'</div><div class="figcol">'+F.join('')+'</div></div><div id="floaters"></div></div><div id="blog"></div>';
  stageBT=BT;stagePrevHp={};stagePrevSh={};stageLogN=0;
}
function spawnFloater(fig,txt,cls){
  const layer=document.getElementById('floaters');if(!layer)return;
  const d=document.createElement('div');d.className='floatdmg '+cls;d.textContent=txt;
  d.style.left=(fig.offsetLeft+fig.offsetWidth*0.5-14+Math.random()*12-6)+'px';
  d.style.top=(fig.offsetTop+6)+'px';
  layer.appendChild(d);setTimeout(function(){d.remove();},950);
}
function updateStage(){
  BT.units.forEach(function(u,i){
    const fig=document.querySelector('.fig[data-i="'+i+'"]');if(!fig)return;
    const hpBar=fig.querySelector('.bar.hp>i');if(hpBar)hpBar.style.width=Math.max(0,u.hp/u.maxHp*100)+'%';
    const enBar=fig.querySelector('.bar.en>i');if(enBar)enBar.style.width=u.energy+'%';
    const meta=fig.querySelector('.figmeta');
    if(meta)meta.innerHTML=fmt(Math.max(0,u.hp))+'/'+fmt(u.maxHp)+(u.shield>0?' 🛡️'+fmt(u.shield):'')+(u.side===0?' · 能量 '+Math.floor(u.energy)+' · 主动 '+(u.cd>0?Math.ceil(u.cd/1000)+'s':'就绪'):'')+statusTags(u);
    const prev=stagePrevHp[i],prevS=stagePrevSh[i];
    if(prev!==undefined&&u.hp<prev)spawnFloater(fig,'-'+(prev-u.hp),'');
    if(prevS!==undefined&&u.shield<prevS&&prevS>0&&u.alive)spawnFloater(fig,'-'+(prevS-u.shield),'absorb');
    stagePrevHp[i]=u.hp;stagePrevSh[i]=u.shield;
    let cls='fig '+(u.side===0?'ally':'foe')+(u.eid==='BOSS'?' big':'')+(u.pos>=2?' back':'');
    if(!u.alive)cls+=' dead';
    else{
      if(BT.lastHit&&BT.lastHit.u===u&&BT.t-BT.lastHit.t<600)cls+=' hit';
      if(BT.lastAct&&BT.lastAct.u===u&&BT.t-BT.lastAct.t<500)cls+=' atk';
    }
    if(fig._cls!==cls){fig._cls=cls;fig.className=cls;}
  });
  const sb=document.getElementById('skillbanner');
  if(sb){if(BT.lastSkill&&BT.t-BT.lastSkill.t<900){sb.style.display='block';sb.textContent=BT.lastSkill.name+' · '+BT.lastSkill.skill;}else sb.style.display='none';}
  const bm=document.getElementById('battlemeta');
  if(bm)bm.textContent='MT 式模式：自动战斗 · 能量满自动放大招 · '+(BT.t/1000).toFixed(1)+'s / 上限 '+(BT.limit/1000)+'s · '+BT.speed+'×';
  const bp=document.getElementById('btnPause2');if(bp)bp.textContent=BT.paused?'继续':'暂停';
  const bs=document.getElementById('btnSpeed2');if(bs)bs.textContent='速度 '+BT.speed+'×';
  if(BT.logs.length!==stageLogN){stageLogN=BT.logs.length;const blog=document.getElementById('blog');if(blog){blog.textContent=BT.logs.join('\n');blog.scrollTop=blog.scrollHeight;}}
}
function renderBattle(){const el=document.getElementById('bbox');if(!BT||!el)return;if(stageBT!==BT)buildStage();updateStage();}
function battleTick(){if(!BT||BT.paused||BT.over)return;for(let i=0;i<2*BT.speed;i++){const r=stepBattle(100);if(r){finishBattle(r);return;}}renderBattle();}
function startBattle(cfg){const allies=buildAllies();const foes=buildFoes(cfg.specs);BT={title:cfg.title,units:allies.concat(foes),t:0,logs:[],speed:1,paused:false,over:false,limit:cfg.limit||90000,mode:cfg.mode||'normal',onEnd:cfg.onEnd};document.getElementById('battle').style.display='flex';renderBattle();BT.timer=setInterval(battleTick,200);log('战斗开始：'+cfg.title);}
function finishBattle(result){if(!BT||BT.over)return;BT.over=true;clearInterval(BT.timer);const win=result==='win';let dmg=0;if(BT.mode==='guildboss'){dmg=BT.units.filter(u=>u.side===1).reduce((a,u)=>a+(u.maxHp-Math.max(0,u.hp)),0);}const aliveCount=BT.units.filter(u=>u.side===0&&u.alive).length;renderBattle();const cb=BT.onEnd;const mode=BT.mode;BT=null;document.getElementById('battle').style.display='none';if(cb)cb(win,result,dmg,aliveCount);else if(win){toast('胜利！');}else toast(result==='timeup'?'时间到，未能取胜':'战斗失败，再练练吧');}
function togglePause(){if(BT)BT.paused=!BT.paused;renderBattle();}
function cycleBattleSpeed(){if(!BT)return;BT.speed=BT.speed>=3?1:BT.speed+1;renderBattle();}
function skipBattle(){if(!BT)return;let r=null;for(let i=0;i<1200&&!r;i++)r=stepBattle(100);finishBattle(r||'lose');}
function quitBattle(){if(!BT)return;clearInterval(BT.timer);BT=null;document.getElementById('battle').style.display='none';render();}
function afterBattleWin(reward,starsEarned,stageIdx){addRes(reward);if(typeof stageIdx==='number'){const deaths=0;S.stages[stageIdx]=Math.max(S.stages[stageIdx]||0,starsEarned);}S.daily.counters.battles++;if(Math.random()<0.3)S.equips.push(newEquip());save();render();}
function startStage(g){const rw=stageReward(g);startBattle({title:'推图 '+(Math.floor(g/10)+1)+'-'+(g%10+1)+' · '+STAGE_NAMES[g],specs:stageEnemies(g),onEnd:(win,result,dmg,aliveCount)=>{if(!win){render();return;}const st=aliveCount>=5?3:aliveCount>=4?2:1;afterBattleWin(rw,st,g);toast('胜利！'+st+' 星通关，奖励：金币 +'+rw.gold+'，经验 +'+rw.exp+(rw.book?'，技能书 +'+rw.book:'')+(rw.dia?'，钻石 +'+rw.dia:'')+(rw.ticket?'，招募券 +'+rw.ticket:'')+(st<3?'（存活 '+aliveCount+'/5 人，未满星可重打）':''));}});}
function startTower(){const f=S.tower+1;const rw={gold:200+f*40,exp:120+f*25,dia:f%5===0?30:0};startBattle({title:'爬塔第 '+f+' 层',specs:towerSpecs(f),onEnd:(win)=>{if(!win){render();return;}S.tower=f;addRes(rw);S.daily.counters.battles++;save();render();toast('通关第 '+f+' 层！金币 +'+rw.gold+'，经验 +'+rw.exp+(rw.dia?'，钻石 +'+rw.dia:''));}});}
function startArena(tier){if(S.arena.day!==todayStr()){S.arena.day=todayStr();S.arena.left=5;}if(S.arena.left<=0){toast('今日挑战次数已用完');return;}S.arena.left--;const opp=arenaOpponent(tier);const specs=opp.map(o=>({eid:o.hid,lv:o.lv,mod:'',row:HEROES[o.hid].pos==='前排'?0:1,heroSpec:o}));const foes=specs.map((sp,i)=>{const st=heroStatsFake(sp.heroSpec);return mkUnit({side:1,pos:i,hid:sp.hid,name:HEROES[sp.hid].name,fac:HEROES[sp.hid].fac,role:HEROES[sp.hid].role,hp:st.hp,maxHp:st.hp,atk:st.atk,armor:st.armor,mres:st.mres,spd:st.spd,int:HEROES[sp.hid].base[5]*1000,kind:'hero'});});
 BT=null;const allies=buildAllies();BT={title:'竞技场 · 模拟对战',units:allies.concat(foes),t:0,logs:[],speed:1,paused:false,over:false,limit:90000,mode:'arena',onEnd:null};document.getElementById('battle').style.display='flex';renderBattle();BT.timer=setInterval(battleTick,200);BT.onEnd=(win)=>{if(win){S.arena.score+=30;S.arena.wins++;}else S.arena.losses++;S.daily.counters.battles++;save();render();toast(win?'竞技场胜利！积分 +30':'竞技场惜败');};log('战斗开始：竞技场');}
function heroStatsFake(o){const H=HEROES[o.hid],sm=STAR_MULT[o.star];return {hp:Math.floor(H.base[0]*(1+0.065*(o.lv-1))*sm),atk:Math.floor(H.base[1]*(1+0.055*(o.lv-1))*sm),armor:H.base[2],mres:H.base[3],spd:H.base[4]};}
function startDungeon(type,diff){if(S.dungeon.date!==todayStr()){S.dungeon={date:todayStr(),used:{gold:0,exp:0,book:0}};}if(S.dungeon.used[type]>=3){toast('今日次数已用完');return;}S.dungeon.used[type]++;const pools={gold:['E05','E08','E02'],exp:['E01','E02','E03','E04'],book:['E09','E07','E10']};const lv=3+diff*6;const specs=pools[type].slice(0,3).map((eid,i)=>({eid,lv,mod:diff>=4&&i===0?'elite':'',row:ENEMIES[eid].row}));const rw=type==='gold'?{gold:350*diff*diff+400*diff}:type==='exp'?{exp:260*diff*diff+320*diff}:{book:2*diff+2,gold:150*diff};startBattle({title:'每日副本 · 难度 '+diff,specs,onEnd:(win)=>{if(!win){render();return;}addRes(rw);S.daily.counters.battles++;save();render();toast('副本胜利！'+JSON.stringify(rw));}});}
function startGuildBoss(){const key='B'+((Math.floor(Date.now()/86400000)%4)+1);const boss=BOSSES[key];const specs=[{eid:'BOSS',lv:30,mod:'',row:0,bossKey:key.slice(1)}];startBattle({title:'公会 Boss · '+boss.name+'（30 秒）',specs,limit:30000,mode:'guildboss',onEnd:(win,result,dmg)=>{const coins=Math.floor(dmg/100);S.guild.bossDmg+=dmg;S.res.gcoin+=coins;save();render();toast('公会 Boss 挑战结束：造成伤害 '+fmt(dmg)+'，公会币 +'+coins);}});}
function startGuildTrial(){const used=S.guild.trialDay===todayStr()?S.guild.trial:0;if(used>=2){toast('今日试炼次数已用完');return;}S.guild.trialDay=todayStr();S.guild.trial=used+1;const specs=[{eid:'E08',lv:25,mod:'',row:0},{eid:'E07',lv:25,mod:'',row:1},{eid:'E09',lv:25,mod:'',row:1},{eid:'E05',lv:25,mod:'',row:0},{eid:'E10',lv:25,mod:'',row:1}];startBattle({title:'公会试炼',specs,onEnd:(win)=>{if(!win){render();return;}S.res.gcoin+=60;S.res.gold+=500;S.daily.counters.battles++;save();render();toast('试炼胜利！公会币 +60，金币 +500');}});}
/* ===== 启动：支持 #view  deep link 方便截屏/直达某页，#battle 自动开一场推图战斗 ===== */
(function(){const h=(location.hash||'').replace('#','');if(['home','map','summon','heroes','tower','arena','dungeon','guild','codex','settings'].indexOf(h)>=0)S.view=h;render();if(h==='battle')setTimeout(function(){startStage(0);},300);})();
</script>
</body></html>
